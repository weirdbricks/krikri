---
# Template Idempotency Test
# Run this TWICE to verify idempotent behavior

- name: Template Idempotency Test
  hosts: testservers
  gather_facts: false
  
  vars:
    server_name: krikri-playbook.example.com
    document_root: /var/www/krikri-playbook
    nginx_port: 8080
    enable_ssl: true
    max_upload_size: 50M
    upstream_servers:
      - server1.example.com
      - server2.example.com
      - server3.example.com
  
  tasks:
    - name: Create output directory
      ansible.builtin.file:
        path: /tmp/krikri-playbook-template-test
        state: directory
        mode: '0755'
    
    - name: Render template (1st time in this run)
      ansible.builtin.template:
        src: testing/templates/nginx-simple.conf.j2
        dest: /tmp/krikri-playbook-template-test/nginx.conf
        mode: '0644'
    
    - name: Render template (2nd time in same run - should be ok)
      ansible.builtin.template:
        src: testing/templates/nginx-simple.conf.j2
        dest: /tmp/krikri-playbook-template-test/nginx.conf
        mode: '0644'
    
    - name: Read rendered template
      ansible.builtin.command: cat /tmp/krikri-playbook-template-test/nginx.conf
      register: rendered
    
    - name: Show rendered template
      ansible.builtin.debug:
        msg: "{{ rendered.stdout }}"
    
    - name: SUCCESS
      ansible.builtin.debug:
        msg: "✓ Template rendered. File kept at /tmp/krikri-playbook-template-test/nginx.conf"

# To cleanup manually:
# ssh root@104.245.38.247 "rm -rf /tmp/krikri-playbook-template-test"

# Expected on FIRST run:
# - Task 1: changed (directory created)
# - Task 2: changed (template rendered)
# - Task 3: ok (content identical)

# Expected on SECOND run (run playbook again):
# - Task 1: ok (directory exists)
# - Task 2: ok (content identical)
# - Task 3: ok (content identical)
