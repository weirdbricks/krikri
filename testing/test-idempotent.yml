---
# Pure Idempotency Test
# Run this playbook TWICE to verify idempotent behavior
# First run: Should show "changed" for file operations
# Second run: Should show "ok" for file operations

- name: Idempotency Test
  hosts: testservers
  gather_facts: false
  
  tasks:
    - name: Test 1 - Create directory (1st=changed, 2nd=ok)
      ansible.builtin.file:
        path: /tmp/crystal-play-idempotent-test
        state: directory
        mode: '0755'
    
    - name: Test 2 - Copy static content (1st=changed, 2nd=ok)
      ansible.builtin.copy:
        content: |
          Static test content - never changes
          Host: {{ inventory_hostname }}
          Version: 1.0
        dest: /tmp/crystal-play-idempotent-test/test.txt
        mode: '0644'
    
    - name: Test 3 - Set file permissions (1st=changed, 2nd=ok)
      ansible.builtin.file:
        path: /tmp/crystal-play-idempotent-test/test.txt
        mode: '0600'
    
    - name: Test 4 - Create subdirectory (1st=changed, 2nd=ok)
      ansible.builtin.file:
        path: /tmp/crystal-play-idempotent-test/subdir
        state: directory
        mode: '0755'
    
    - name: Test 5 - Copy same content again (both runs=ok)
      ansible.builtin.copy:
        content: |
          Static test content - never changes
          Host: {{ inventory_hostname }}
          Version: 1.0
        dest: /tmp/crystal-play-idempotent-test/test.txt
        mode: '0600'
    
    - name: SUCCESS
      ansible.builtin.debug:
        msg: "✓ Idempotency test complete. Run again to verify 'ok' status."

# To cleanup after testing, run:
# rm -rf /tmp/crystal-play-idempotent-test
