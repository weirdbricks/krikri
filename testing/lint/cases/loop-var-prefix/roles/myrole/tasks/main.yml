---
- name: Loop over values with a loop_var that lacks the role prefix
  ansible.builtin.debug:
    msg: "{{ my_item }}"
  loop:
    - one
    - two
  loop_control:
    loop_var: my_item

- name: Loop over values with the role's loop_var prefix
  ansible.builtin.debug:
    msg: "{{ myrole_item }}"
  loop:
    - one
    - two
  loop_control:
    loop_var: myrole_item
