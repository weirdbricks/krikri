---
- name: No-log-password rule cases
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Looped task with a password argument and no no_log
      ansible.builtin.user:
        name: krikri_triage_no_such_user
        password: "{{ item }}"
        state: absent
      loop:
        - s3cret

    - name: Looped task with a password argument and no_log true
      ansible.builtin.user:
        name: krikri_triage_no_such_user
        password: "{{ item }}"
        state: absent
      loop:
        - s3cret
      no_log: true

    - name: Unlooped task with a password argument
      ansible.builtin.user:
        name: krikri_triage_no_such_user
        password: s3cret
        state: absent

    - name: Looped task with passwd and secret names but no password argument
      ansible.builtin.set_fact:
        passwd: "{{ item }}"
        secret: "{{ item }}"
      loop:
        - s3cret
