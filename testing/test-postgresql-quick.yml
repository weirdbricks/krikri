# postgresql_db:/postgresql_user: smoke test. Requires a real PostgreSQL
# server reachable at 127.0.0.1:15432 (postgres/rootpass) - same
# convention as test-mysql-quick.yml: targets "testservers" so a --check
# run against the generic empty inventory skips the whole play rather
# than needing a real server.

- name: postgresql plugins test
  hosts: testservers
  gather_facts: false

  vars:
    test_db: crystal_ansible_test_db
    test_user: crystal_ansible_test_user
    login_host: 127.0.0.1
    login_port: 15432
    login_user: postgres
    login_password: rootpass

  tasks:
    - name: ensure the test database is present
      community.postgresql.postgresql_db:
        name: "{{ test_db }}"
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: db_first

    - name: ensure the test database is present (idempotent)
      community.postgresql.postgresql_db:
        name: "{{ test_db }}"
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: db_idempotent

    - name: write the seed SQL
      ansible.builtin.copy:
        content: |
          CREATE TABLE IF NOT EXISTS t (id INT PRIMARY KEY, name TEXT);
          INSERT INTO t VALUES (1, 'alice'), (2, 'bob');
        dest: /tmp/krikri-playbook-pg-seed.sql

    - name: restore the seed data
      community.postgresql.postgresql_db:
        name: "{{ test_db }}"
        state: restore
        target: /tmp/krikri-playbook-pg-seed.sql
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: db_restore

    - name: dump the database, gzip-compressed
      community.postgresql.postgresql_db:
        name: "{{ test_db }}"
        state: dump
        target: /tmp/krikri-playbook-pg-dump.sql.gz
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: db_dump

    - name: create a second database to restore the dump into
      community.postgresql.postgresql_db:
        name: "{{ test_db }}_restored"
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"

    - name: restore the gzip-compressed dump into the second database
      community.postgresql.postgresql_db:
        name: "{{ test_db }}_restored"
        state: restore
        target: /tmp/krikri-playbook-pg-dump.sql.gz
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: db_restore_gz

    - name: verify the restored data round-tripped correctly
      ansible.builtin.shell: >-
        psql postgresql://{{ login_user }}:{{ login_password }}@{{ login_host }}:{{ login_port }}/{{ test_db }}_restored
        -tAc "SELECT COUNT(*) FROM t"
      register: restored_count
      changed_when: false

    - name: remove the second database
      community.postgresql.postgresql_db:
        name: "{{ test_db }}_restored"
        state: absent
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"

    - name: dump the database, pg_restore custom format (.pgc)
      community.postgresql.postgresql_db:
        name: "{{ test_db }}"
        state: dump
        target: /tmp/krikri-playbook-pg-dump.pgc
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: db_dump_pgc

    - name: create a third database to restore the .pgc dump into
      community.postgresql.postgresql_db:
        name: "{{ test_db }}_pgc"
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"

    - name: restore the .pgc dump via pg_restore, not psql
      community.postgresql.postgresql_db:
        name: "{{ test_db }}_pgc"
        state: restore
        target: /tmp/krikri-playbook-pg-dump.pgc
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: db_restore_pgc

    - name: verify the .pgc-restored data round-tripped correctly
      ansible.builtin.shell: >-
        psql postgresql://{{ login_user }}:{{ login_password }}@{{ login_host }}:{{ login_port }}/{{ test_db }}_pgc
        -tAc "SELECT COUNT(*) FROM t"
      register: restored_count_pgc
      changed_when: false

    - name: remove the third database
      community.postgresql.postgresql_db:
        name: "{{ test_db }}_pgc"
        state: absent
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"

    - name: create the test role
      community.postgresql.postgresql_user:
        name: "{{ test_user }}"
        password: secret123
        role_attr_flags: LOGIN,CREATEDB
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: user_first

    - name: create the test role (idempotent)
      community.postgresql.postgresql_user:
        name: "{{ test_user }}"
        role_attr_flags: LOGIN,CREATEDB
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: user_idempotent

    - name: change the role's attribute flags
      community.postgresql.postgresql_user:
        name: "{{ test_user }}"
        role_attr_flags: LOGIN,NOCREATEDB,SUPERUSER
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: user_flags_changed

    - name: remove the test role
      community.postgresql.postgresql_user:
        name: "{{ test_user }}"
        state: absent
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: user_removed

    - name: remove the test database
      community.postgresql.postgresql_db:
        name: "{{ test_db }}"
        state: absent
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: db_removed

    - name: show results
      ansible.builtin.debug:
        msg: >-
          db_first={{ db_first.changed }}
          db_idempotent={{ db_idempotent.changed }}
          db_restore={{ db_restore.changed }}
          db_dump={{ db_dump.changed }}
          db_restore_gz={{ db_restore_gz.changed }}
          restored_count={{ restored_count.stdout }}
          db_dump_pgc={{ db_dump_pgc.changed }}
          db_restore_pgc={{ db_restore_pgc.changed }}
          restored_count_pgc={{ restored_count_pgc.stdout }}
          user_first={{ user_first.changed }}
          user_idempotent={{ user_idempotent.changed }}
          user_flags_changed={{ user_flags_changed.changed }}
          user_removed={{ user_removed.changed }}
          db_removed={{ db_removed.changed }}

    - name: SUCCESS
      ansible.builtin.debug:
        msg: "postgresql plugins smoke test complete!"
