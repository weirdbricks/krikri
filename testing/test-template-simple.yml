---
# Simple Template Test - REMOTE
# Quick validation that template plugin works
# Run with: ./bin/krikri-playbook -i inventory.ini test-template-simple.yml

- name: Simple Template Test (Remote)
  hosts: testservers
  gather_facts: false
  
  vars:
    server_name: krikri-playbook.example.com
    document_root: /var/www/krikri-playbook
    nginx_port: 8080
    enable_ssl: true
    max_upload_size: 50M
    upstream_servers:
      - server1.example.com
      - server2.example.com
      - server3.example.com
  
  tasks:
    - name: Create output directory
      ansible.builtin.file:
        path: /tmp/krikri-playbook-template-test
        state: directory
        mode: '0755'
    
    - name: Render template (1st run - should change)
      ansible.builtin.template:
        src: testing/templates/nginx-simple.conf.j2
        dest: /tmp/krikri-playbook-template-test/nginx.conf
        mode: '0644'
      register: first_render
    
    - name: Show first render result
      ansible.builtin.debug:
        msg: "First render - changed: {{ first_render.changed }} (should be TRUE)"
    
    - name: Render template again (2nd run - should be ok/idempotent)
      ansible.builtin.template:
        src: testing/templates/nginx-simple.conf.j2
        dest: /tmp/krikri-playbook-template-test/nginx.conf
        mode: '0644'
      register: second_render
    
    - name: Show second render result
      ansible.builtin.debug:
        msg: "Second render - changed: {{ second_render.changed }} (should be FALSE for idempotency)"
    
    - name: Read rendered template
      ansible.builtin.command: cat /tmp/krikri-playbook-template-test/nginx.conf
      register: rendered
    
    - name: Show rendered template (first 15 lines)
      ansible.builtin.debug:
        msg: "{{ rendered.stdout_lines[:15] }}"
    
    - name: Verify SSL section exists
      ansible.builtin.shell: grep -c "SSL Configuration" /tmp/krikri-playbook-template-test/nginx.conf
      register: ssl_check
      ignore_errors: yes
    
    - name: Show SSL check
      ansible.builtin.debug:
        msg: "SSL section found: {{ ssl_check.rc == 0 }} (count: {{ ssl_check.stdout }})"
    
    - name: Verify upstream servers rendered
      ansible.builtin.shell: grep -c "Upstream:" /tmp/krikri-playbook-template-test/nginx.conf
      register: upstream_check
    
    - name: Show upstream check
      ansible.builtin.debug:
        msg: "Found {{ upstream_check.stdout }} upstream servers (expected 3)"
    
    - name: Verify port substitution
      ansible.builtin.shell: grep -c "listen 8080" /tmp/krikri-playbook-template-test/nginx.conf
      register: port_check
    
    - name: Show port check
      ansible.builtin.debug:
        msg: "Port 8080 found: {{ port_check.stdout }} times"
    
    - name: Summary
      ansible.builtin.debug:
        msg:
          - "======================================"
          - "Simple Template Test Results"
          - "======================================"
          - "First render:  {{ first_render.changed }} (should be true)"
          - "Second render: {{ second_render.changed }} (should be false)"
          - "SSL section:   {{ ssl_check.rc == 0 }}"
          - "Upstreams:     {{ upstream_check.stdout }}/3"
          - "Port correct:  {{ port_check.stdout }} occurrence(s)"
          - "======================================"
          - "Status: {% if not second_render.changed %}IDEMPOTENCY WORKING ✓{% else %}IDEMPOTENCY BROKEN ✗{% endif %}"
          - "======================================"
    
    - name: Cleanup (disabled - keep for inspection)
      ansible.builtin.file:
        path: /tmp/krikri-playbook-template-test
        state: absent
      when: false
    
    - name: File Location
      ansible.builtin.debug:
        msg: "Files kept at /tmp/krikri-playbook-template-test/ on remote servers"
