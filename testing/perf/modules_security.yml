---
# Module-coverage benchmark/regression playbook 3 of 5: users, security
# and crypto. Companion to modules_files.yml (files), modules_packages.yml
# (packages/services) and synthetic_batch_bench.yml (batching stress).
# Theme: user/group accounts, PAM, SELinux/firewall surfaces, file
# capabilities, and the whole openssl/x509/openssh crypto family:
#   user, group, getent, pamd, pam_limits, seboolean, sefcontext,
#   selinux, seport, capabilities, firewalld, ufw, iptables,
#   openssl_csr, openssl_csr_info, openssl_dhparam, openssl_pkcs12,
#   openssl_privatekey, openssl_privatekey_info, openssl_publickey,
#   openssl_publickey_info, x509_certificate, x509_certificate_info,
#   openssh_keypair, get_certificate, java_cert
# (the crypto family lives in tasks_security_certs.yml, pulled in via
# include_tasks so this playbook also exercises the include machinery).
#
# Safety rules, same conventions as the sibling playbooks:
# - All file mutations land under the run's own namespaced dir
#   (/tmp/krikri-sec-bench-<epoch>): throwaway users, throwaway PAM
#   config under <dir>/pam.d (pamd's `path:` and pam_limits' `dest:`
#   point there - real /etc/pam.d and /etc/security/limits.conf are
#   never touched, because a bad PAM edit can lock out login).
# - capabilities sets a cap on a throwaway COPY of /bin/cat under the
#   bench dir, never on a real system binary.
# - Firewall exercises (ufw/iptables) are narrow, namespaced, and
#   reversible: single unlikely port, dedicated iptables chain, no
#   `state: enabled`/policy changes anywhere - an over-broad rule on
#   the probe host could cut the run's own SSH access mid-playbook.
#   Every rule is deleted again in its section's cleanup tasks.
# - Modules with no reachable backend on the target are gated with
#   capability probes so they SKIP the way real Ansible does
#   (skipped: in the recap), never faked: the SELinux family (no
#   SELinux on Debian-family hosts), firewalld (RHEL-family), and
#   java_cert unless a JDK (keytool) happens to be installed.
# - Package installs are a deliberate exception (like zfsutils-linux
#   in synthetic_batch_bench.yml): libcap2-bin/iptables/ufw are the
#   minimum tooling for this theme and every rule they enable is
#   removed again in the same run.
# - Byte-diff pattern after anything that renders or writes content:
#   cat/register/debug, so output can be eyeballed across engines.
#   Crypto material is per-run random, so the byte-diff here targets
#   the deterministic derivations: the checked-in fixed keys (vars
#   below), the public key and CSR derived from them (PKCS#10 and
#   public-key PEM carry no timestamps or salt), and the openssl
#   -text dumps of those. Freshly generated keys, certificates
#   (not_before/not_after), and PKCS#12 blobs (random salt) are
#   compared by recap and by the shape of their info-module output,
#   not by bytes - that is a property of the domain, not a shortcut.

- name: Users, security and crypto module-coverage benchmark
  hosts: all
  gather_facts: true

  vars:
    sec_bench_mode: security
    # Var chain: each level derives from the previous one - the chained
    # re-templating behavior this engine's evaluators got wrong before.
    sec_bench_epoch: "{{ ansible_date_time.epoch }}"
    sec_run_id: "run-{{ sec_bench_epoch }}"
    sec_dir: "/tmp/krikri-sec-bench-{{ sec_bench_epoch }}"
    sec_home_dir: "{{ sec_dir }}/home"
    sec_pam_dir: "{{ sec_dir }}/pam.d"
    sec_crypto_dir: "{{ sec_dir }}/crypto"
    sec_fw_port: "47532"
    sec_users:
      - { name: secweb, shell: /usr/sbin/nologin, comment: "krikri sec bench web" }
      - { name: secdb, shell: /bin/sh, comment: "krikri sec bench db" }
      - { name: seccron, shell: /bin/sh, comment: "krikri sec bench cron" }
    # Fixed well-formed throwaway keys (generated once, checked in as
    # literals) so CSR/public-key derivation is deterministic and
    # byte-diffable across engines. Same pattern as modules_files.yml's
    # checked-in public keys.
    sec_fixed_rsa_key: |
      -----BEGIN RSA PRIVATE KEY-----
      MIIEogIBAAKCAQEAp8ZtWvKewymDzYgrymwkHOUzsmlBbavm05nZfl2KPo4GDxKT
      hjdzTHfHD17QQMR4E69mTKxsy0bJ8vImb1IGOJ9Vizu9B+hjWQvKx1JzcApsTpky
      fVD6c6AQ3F8g7kCWxmzsR0PAED6Sx6p9Oet+2oAN1YxsgSlUyHrwOkICkX1hqJzb
      9zQrQRrWYW4HZ0ABIzsBbQMqczJQ6Jfy+1FWiaaQi9suSwQ87XlPLGKVTFAi3Qt5
      ymrNol2HONR24dWAJeJcAt/uxhzNSh19s/SO9yirHdM2iUm2GiHTyaoyv8dkOkTb
