# htpasswd edge cases (community.general.htpasswd on the real side;
# run.sh's htpasswd-gated block installs passlib in the real container
# and the openssl CLI in both - krikri's plugin shells to `openssl
# passwd` for hashing, the real module to passlib).
#
# Hash strings are never echoed (they differ by construction - random
# salts), so the debug lines compare failure surface, changed-state and
# the module's own stable msg text.
- hosts: all
  gather_facts: false

  tasks:
    - name: "H1 create file and add first user"
      community.general.htpasswd:
        path: /work/htp
        name: alice
        password: s3cret
      register: h1
    - ansible.builtin.debug:
        msg: "H1 failed={{ h1.failed }} changed={{ h1.changed }} msg={{ h1.msg }}"

    - name: "H2 same user same password is a no-op"
      community.general.htpasswd:
        path: /work/htp
        name: alice
        password: s3cret
      register: h2
    - ansible.builtin.debug:
        msg: "H2 failed={{ h2.failed }} changed={{ h2.changed }} msg={{ h2.msg }}"

    - name: "H3 same user different password changes"
      community.general.htpasswd:
        path: /work/htp
        name: alice
        password: n3ws3cret
      register: h3
    - ansible.builtin.debug:
        msg: "H3 failed={{ h3.failed }} changed={{ h3.changed }} msg={{ h3.msg }}"

    - name: "H4 second user on the existing file"
      community.general.htpasswd:
        path: /work/htp
        name: bob
        password: pw2
      register: h4
    - ansible.builtin.debug:
        msg: "H4 failed={{ h4.failed }} changed={{ h4.changed }} msg={{ h4.msg }}"

    - name: "H5 user count is two"
      ansible.builtin.command: awk -F: '/[^#]/ {n++} END {print n+0}' /work/htp
      register: h5
      changed_when: false
    - ansible.builtin.debug:
        msg: "H5 users={{ h5.stdout }}"

    - name: "H6 create=false with a missing file fails"
      community.general.htpasswd:
        path: /work/htp-missing
        name: alice
        password: s3cret
        create: false
      register: h6
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "H6 failed={{ h6.failed | default('none') }} changed={{ h6.changed | default('none') }} msg={{ h6.msg | default('none') }}"

    - name: "H7 state=absent removes the user"
      community.general.htpasswd:
        path: /work/htp
        name: bob
        state: absent
      register: h7
    - ansible.builtin.debug:
        msg: "H7 failed={{ h7.failed }} changed={{ h7.changed }} msg={{ h7.msg }}"

    - name: "H8 state=absent for a user never present is a no-op"
      community.general.htpasswd:
        path: /work/htp
        name: bob
        state: absent
      register: h8
    - ansible.builtin.debug:
        msg: "H8 failed={{ h8.failed }} changed={{ h8.changed }} msg={{ h8.msg }}"

    - name: "H9 state=present without a password fails"
      community.general.htpasswd:
        path: /work/htp
        name: nopw
      register: h9
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "H9 failed={{ h9.failed | default('none') }} changed={{ h9.changed | default('none') }} msg={{ h9.msg | default('none') }}"

    - name: "H10 unsupported crypt_scheme fails"
      community.general.htpasswd:
        path: /work/htp
        name: carol
        password: pw3
        crypt_scheme: bcrypt
      register: h10
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "H10 failed={{ h10.failed | default('none') }} changed={{ h10.changed | default('none') }} msg={{ h10.msg | default('none') }}"

    - name: "H11 mode is applied to the file"
      community.general.htpasswd:
        path: /work/htp
        name: alice
        password: s3cret
        mode: "0640"
      register: h11
    - ansible.builtin.debug:
        msg: "H11 failed={{ h11.failed }} changed={{ h11.changed }} perms={{ h11.path is file and (((h11.path | stat).mode) == '0640') }}"

    - name: "H12 check mode makes no change"
      community.general.htpasswd:
        path: /work/htp
        name: dave
        password: pw4
      check_mode: true
      register: h12
    - ansible.builtin.debug:
        msg: "H12 failed={{ h12.failed }} changed={{ h12.changed }} absent={{ 'dave' not in (lookup('file', '/work/htp') or '') }}"
