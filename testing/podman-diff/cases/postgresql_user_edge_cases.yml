# postgresql_user module edge cases. There is NO PostgreSQL server in
# the harness containers (a real-server lifecycle belongs to the
# Atlantic.net role rounds), so these are validation-only cases: they
# check WHICH failure each engine reports first (argument-spec
# rejection vs connection failure) and the failed=/changed= shape.
# Real community.postgresql needs the collection installed (run.sh's
# ^postgresql gated block). Msg wording differs between engines and is
# not a bug.
- hosts: all
  gather_facts: false

  tasks:
    - name: "Q1 missing required name param"
      community.postgresql.postgresql_user:
        state: present
      register: q1
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "Q1 failed={{ q1.failed | default('none') }} changed={{ q1.changed | default('none') }}"

    - name: "Q2 invalid state value"
      community.postgresql.postgresql_user:
        name: krikri
        state: destroyed
      register: q2
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "Q2 failed={{ q2.failed | default('none') }} changed={{ q2.changed | default('none') }}"

    - name: "Q3 out-of-spec parameter"
      community.postgresql.postgresql_user:
        name: krikri
        krikri_not_a_pg_user_param: true
      register: q3
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "Q3 failed={{ q3.failed | default('none') }} changed={{ q3.changed | default('none') }}"

    - name: "Q4 invalid role_attr_flags"
      community.postgresql.postgresql_user:
        name: krikri
        role_attr_flags: BOGUSFLAG
      register: q4
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "Q4 failed={{ q4.failed | default('none') }} changed={{ q4.changed | default('none') }}"

    - name: "Q5 non-numeric login_port"
      community.postgresql.postgresql_user:
        name: krikri
        login_port: notaport
      register: q5
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "Q5 failed={{ q5.failed | default('none') }} changed={{ q5.changed | default('none') }}"

    - name: "Q6 trust_input false rejects an unsafe name before any connection"
      community.postgresql.postgresql_user:
        name: "kri; DROP TABLE users"
        trust_input: false
      register: q6
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "Q6 failed={{ q6.failed | default('none') }} changed={{ q6.changed | default('none') }}"

    - name: "Q7 no server to connect to on a custom port"
      community.postgresql.postgresql_user:
        name: krikri
        login_host: 127.0.0.1
        login_port: 13399
        login_user: krikri
        login_password: krikri
      register: q7
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "Q7 failed={{ q7.failed | default('none') }} changed={{ q7.changed | default('none') }}"

    - name: "Q8 state absent on a role, no server - still just a connection failure"
      community.postgresql.postgresql_user:
        name: krikri
        state: absent
        login_host: 127.0.0.1
        login_port: 13399
      register: q8
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "Q8 failed={{ q8.failed | default('none') }} changed={{ q8.changed | default('none') }}"
