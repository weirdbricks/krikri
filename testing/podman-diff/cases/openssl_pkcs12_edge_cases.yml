# openssl_pkcs12 edge cases. The openssl CLI is installed in BOTH
# containers by run.sh's ^openssl gate. failed=/changed= and on-disk
# state (openssl pkcs12 can read the archive with the passphrase) are
# what matter; error MESSAGE WORDING may differ.
- hosts: all
  gather_facts: false

  tasks:
    - name: "T1 generate fixture key + cert"
      ansible.builtin.shell: "openssl req -x509 -newkey rsa:2048 -keyout /tmp/t-key.pem -out /tmp/t-cert.pem -days 2 -nodes -subj /CN=krikri 2>/dev/null && openssl req -x509 -newkey rsa:2048 -keyout /tmp/t-key2.pem -out /tmp/t-cert2.pem -days 2 -nodes -subj /CN=krikri2 2>/dev/null"
      register: t1
      ignore_errors: true
      changed_when: false

    - name: "T2 missing required path"
      community.crypto.openssl_pkcs12:
        privatekey_path: /tmp/t-key.pem
      register: t2
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "T2 failed={{ t2.failed }} changed={{ t2.changed | default('none') }}"

    - name: "T3 invalid action choice"
      community.crypto.openssl_pkcs12:
        path: /tmp/t-a.p12
        action: banana
      register: t3
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "T3 failed={{ t3.failed }} changed={{ t3.changed | default('none') }}"

    - name: "T4 invalid state choice"
      community.crypto.openssl_pkcs12:
        path: /tmp/t-a.p12
        state: banana
      register: t4
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "T4 failed={{ t4.failed }} changed={{ t4.changed | default('none') }}"

    - name: "T5 iter_size that is not an int"
      community.crypto.openssl_pkcs12:
        path: /tmp/t-a.p12
        privatekey_path: /tmp/t-key.pem
        iter_size: not-an-int
      register: t5
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "T5 failed={{ t5.failed }} changed={{ t5.changed | default('none') }}"

    - name: "T6 force that is not a bool"
      community.crypto.openssl_pkcs12:
        path: /tmp/t-a.p12
        privatekey_path: /tmp/t-key.pem
        force: banana
      register: t6
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "T6 failed={{ t6.failed }} changed={{ t6.changed | default('none') }}"

    - name: "T7 unsupported parameter"
      community.crypto.openssl_pkcs12:
        path: /tmp/t-a.p12
        privatekey_path: /tmp/t-key.pem
        banana: true
      register: t7
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "T7 failed={{ t7.failed }} changed={{ t7.changed | default('none') }}"

    - name: "T8 action=parse without src"
      community.crypto.openssl_pkcs12:
        path: /tmp/t-bundle.pem
        action: parse
      register: t8
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "T8 failed={{ t8.failed }} changed={{ t8.changed | default('none') }}"

    - name: "T9 privatekey_path and privatekey_content are mutually exclusive"
      community.crypto.openssl_pkcs12:
        path: /tmp/t-a.p12
        privatekey_path: /tmp/t-key.pem
        privatekey_content: banana
      register: t9
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "T9 failed={{ t9.failed }} changed={{ t9.changed | default('none') }}"

    - name: "T10 certificate_path and certificate_content are mutually exclusive"
      community.crypto.openssl_pkcs12:
        path: /tmp/t-a.p12
        privatekey_path: /tmp/t-key.pem
        certificate_path: /tmp/t-cert.pem
        certificate_content: banana
      register: t10
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "T10 failed={{ t10.failed }} changed={{ t10.changed | default('none') }}"

    - name: "T11 missing private key file fails"
      community.crypto.openssl_pkcs12:
        path: /tmp/t-a.p12
        privatekey_path: /tmp/t-nope.pem
      register: t11
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "T11 failed={{ t11.failed }} changed={{ t11.changed | default('none') }}"

    - name: "T12 export creates the archive"
      community.crypto.openssl_pkcs12:
        path: /tmp/t-a.p12
        privatekey_path: /tmp/t-key.pem
        certificate_path: /tmp/t-cert.pem
        passphrase: t12-secret
        friendly_name: krikri
      register: t12
      ignore_errors: true
    - name: "T12b archive is readable with the passphrase"
      ansible.builtin.shell: "openssl pkcs12 -in /tmp/t-a.p12 -passin pass:t12-secret -info -nokeys 2>/dev/null | grep -c 'friendlyName: krikri' || true"
      register: t12b
      changed_when: false
    - ansible.builtin.debug:
        msg: "T12 failed={{ t12.failed }} changed={{ t12.changed | default('none') }} friendly={{ t12b.stdout | default('none') }}"

    - name: "T13 re-export same inputs is idempotent"
      community.crypto.openssl_pkcs12:
        path: /tmp/t-a.p12
        privatekey_path: /tmp/t-key.pem
        certificate_path: /tmp/t-cert.pem
        passphrase: t12-secret
        friendly_name: krikri
      register: t13
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "T13 failed={{ t13.failed }} changed={{ t13.changed }}"

    - name: "T14 check-mode with a different cert claims change"
      community.crypto.openssl_pkcs12:
        path: /tmp/t-a.p12
        privatekey_path: /tmp/t-key.pem
        certificate_path: /tmp/t-cert2.pem
        passphrase: t12-secret
        friendly_name: krikri
      check_mode: true
      register: t14
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "T14 failed={{ t14.failed }} changed={{ t14.changed | default('none') }}"

    - name: "T15 parse converts the archive back to PEM"
      community.crypto.openssl_pkcs12:
        path: /tmp/t-bundle.pem
        action: parse
        src: /tmp/t-a.p12
        passphrase: t12-secret
      register: t15
      ignore_errors: true
    - name: "T15b bundle holds the key and the cert"
      ansible.builtin.shell: "grep -c 'PRIVATE KEY\\|CERTIFICATE' /tmp/t-bundle.pem 2>/dev/null | head -1; grep -c 'PRIVATE KEY' /tmp/t-bundle.pem 2>/dev/null || true"
      register: t15b
      changed_when: false
    - ansible.builtin.debug:
        msg: "T15 failed={{ t15.failed }} changed={{ t15.changed | default('none') }} blocks={{ (t15b.stdout_lines | default([])) | first | default('none') }}"

    - name: "T16 parse with the wrong passphrase fails"
      community.crypto.openssl_pkcs12:
        path: /tmp/t-bundle2.pem
        action: parse
        src: /tmp/t-a.p12
        passphrase: wrong-pass
      register: t16
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "T16 failed={{ t16.failed }} changed={{ t16.changed | default('none') }}"

    - name: "T17 privatekey_content variant works"
      community.crypto.openssl_pkcs12:
        path: /tmp/t-c.p12
        privatekey_content: "{{ lookup('ansible.builtin.file', '/tmp/t-key2.pem') }}"
        certificate_path: /tmp/t-cert2.pem
        passphrase: t17-secret
      register: t17
      ignore_errors: true
    - name: "T17b archive is readable with the passphrase"
      ansible.builtin.shell: "openssl pkcs12 -in /tmp/t-c.p12 -passin pass:t17-secret -nodes 2>/dev/null | grep -c 'PRIVATE KEY' || true"
      register: t17b
      changed_when: false
    - ansible.builtin.debug:
        msg: "T17 failed={{ t17.failed }} changed={{ t17.changed | default('none') }} keyblocks={{ t17b.stdout | default('none') }}"

    - name: "T18 state=absent removes the archive"
      community.crypto.openssl_pkcs12:
        path: /tmp/t-c.p12
        state: absent
      register: t18
      ignore_errors: true
    - name: "T18b file gone"
      ansible.builtin.stat:
        path: /tmp/t-c.p12
      register: t18b
    - ansible.builtin.debug:
        msg: "T18 failed={{ t18.failed }} changed={{ t18.changed | default('none') }} exists={{ t18b.stat.exists | default('none') }}"
