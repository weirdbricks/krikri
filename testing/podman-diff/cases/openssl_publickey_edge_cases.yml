# openssl_publickey edge cases. The openssl CLI is installed in BOTH
# containers by run.sh's ^openssl gate. failed=/changed= and on-disk
# state (the public key file parses and matches the source key) are
# what matter; error MESSAGE WORDING may differ.
- hosts: all
  gather_facts: false

  tasks:
    - name: "U1 generate a fixture key"
      ansible.builtin.shell: "openssl genrsa -out /tmp/u-key.pem 2048 2>/dev/null"
      register: u1
      ignore_errors: true
      changed_when: false

    - name: "U2 missing required path"
      community.crypto.openssl_publickey:
        privatekey_path: /tmp/u-key.pem
      register: u2
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "U2 failed={{ u2.failed }} changed={{ u2.changed | default('none') }}"

    - name: "U3 state=present without a private key"
      community.crypto.openssl_publickey:
        path: /tmp/u-a.pub
      register: u3
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "U3 failed={{ u3.failed }} changed={{ u3.changed | default('none') }}"

    - name: "U4 privatekey_path and privatekey_content are mutually exclusive"
      community.crypto.openssl_publickey:
        path: /tmp/u-a.pub
        privatekey_path: /tmp/u-key.pem
        privatekey_content: banana
      register: u4
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "U4 failed={{ u4.failed }} changed={{ u4.changed | default('none') }}"

    - name: "U5 invalid format choice"
      community.crypto.openssl_publickey:
        path: /tmp/u-a.pub
        privatekey_path: /tmp/u-key.pem
        format: banana
      register: u5
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "U5 failed={{ u5.failed }} changed={{ u5.changed | default('none') }}"

    - name: "U6 invalid state choice"
      community.crypto.openssl_publickey:
        path: /tmp/u-a.pub
        privatekey_path: /tmp/u-key.pem
        state: banana
      register: u6
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "U6 failed={{ u6.failed }} changed={{ u6.changed | default('none') }}"

    - name: "U7 force that is not a bool"
      community.crypto.openssl_publickey:
        path: /tmp/u-a.pub
        privatekey_path: /tmp/u-key.pem
        force: banana
      register: u7
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "U7 failed={{ u7.failed }} changed={{ u7.changed | default('none') }}"

    - name: "U8 unsupported parameter"
      community.crypto.openssl_publickey:
        path: /tmp/u-a.pub
        privatekey_path: /tmp/u-key.pem
        banana: true
      register: u8
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "U8 failed={{ u8.failed }} changed={{ u8.changed | default('none') }}"

    - name: "U9 missing private key file fails"
      community.crypto.openssl_publickey:
        path: /tmp/u-a.pub
        privatekey_path: /tmp/u-nope.pem
      register: u9
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "U9 failed={{ u9.failed }} changed={{ u9.changed | default('none') }}"

    - name: "U10 derive the public key"
      community.crypto.openssl_publickey:
        path: /tmp/u-a.pub
        privatekey_path: /tmp/u-key.pem
      register: u10
      ignore_errors: true
    - name: "U10b file parses and matches the source key"
      ansible.builtin.shell: "test \"$(openssl pkey -in /tmp/u-key.pem -pubout 2>/dev/null | openssl md5)\" = \"$(openssl pkey -pubin -in /tmp/u-a.pub 2>/dev/null | openssl md5)\" && echo match || echo differ"
      register: u10b
      changed_when: false
    - ansible.builtin.debug:
        msg: "U10 failed={{ u10.failed }} changed={{ u10.changed | default('none') }} keymatch={{ u10b.stdout | default('none') }}"

    - name: "U11 re-run is idempotent"
      community.crypto.openssl_publickey:
        path: /tmp/u-a.pub
        privatekey_path: /tmp/u-key.pem
      register: u11
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "U11 failed={{ u11.failed }} changed={{ u11.changed }}"

    - name: "U12 check-mode removal claims change"
      community.crypto.openssl_publickey:
        path: /tmp/u-a.pub
        privatekey_path: /tmp/u-key.pem
      check_mode: true
      register: u12
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "U12 failed={{ u12.failed }} changed={{ u12.changed | default('none') }}"

    - name: "U13 privatekey_content variant works"
      community.crypto.openssl_publickey:
        path: /tmp/u-b.pub
        privatekey_content: "{{ lookup('ansible.builtin.file', '/tmp/u-key.pem') }}"
      register: u13
      ignore_errors: true
    - name: "U13b file parses"
      ansible.builtin.shell: "openssl pkey -pubin -in /tmp/u-b.pub -noout 2>/dev/null | wc -l"
      register: u13b
      changed_when: false
    - ansible.builtin.debug:
        msg: "U13 failed={{ u13.failed }} changed={{ u13.changed | default('none') }} parse={{ u13b.stdout | default('none') }}"

    - name: "U14 format=OpenSSH derives the ssh line"
      community.crypto.openssl_publickey:
        path: /tmp/u-c.pub
        privatekey_path: /tmp/u-key.pem
        format: OpenSSH
      register: u14
      ignore_errors: true
    - name: "U14b file is a one-line ssh public key"
      ansible.builtin.shell: "awk '{print $1}' /tmp/u-c.pub 2>/dev/null"
      register: u14b
      changed_when: false
    - ansible.builtin.debug:
        msg: "U14 failed={{ u14.failed }} changed={{ u14.changed | default('none') }} kind={{ u14b.stdout | default('none') }}"

    - name: "U15 state=absent removes the file"
      community.crypto.openssl_publickey:
        path: /tmp/u-b.pub
        state: absent
      register: u15
      ignore_errors: true
    - name: "U15b file gone"
      ansible.builtin.stat:
        path: /tmp/u-b.pub
      register: u15b
    - ansible.builtin.debug:
        msg: "U15 failed={{ u15.failed }} changed={{ u15.changed | default('none') }} exists={{ u15b.stat.exists | default('none') }}"

    - name: "U16 state=absent again is a no-op"
      community.crypto.openssl_publickey:
        path: /tmp/u-b.pub
        state: absent
      register: u16
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "U16 failed={{ u16.failed }} changed={{ u16.changed }}"
