# mysql_db module edge cases. There is NO MySQL server in the harness
# containers (a real-server lifecycle belongs to the Atlantic.net role
# rounds), so these are validation-only cases: they check WHICH error
# each engine reports first (argument-spec rejection vs connection/
# driver failure) and the failed=/changed= shape, not database
# operations. Real mysql_db fails on the missing pymysql driver before
# any connection attempt; the msg wording differs between engines and
# is not a bug.
- hosts: all
  gather_facts: false

  tasks:
    - name: "N1 mysql_db with a missing required name param"
      community.mysql.mysql_db:
        state: present
      register: n1
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "N1 failed={{ n1.failed | default('none') }} changed={{ n1.changed | default('none') }}"

    - name: "N2 mysql_db with an invalid state value"
      community.mysql.mysql_db:
        name: krikri
        state: installed-nowhere
      register: n2
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "N2 failed={{ n2.failed | default('none') }} changed={{ n2.changed | default('none') }}"

    - name: "N3 mysql_db with an out-of-spec parameter"
      community.mysql.mysql_db:
        name: krikri
        state: present
        krikri_not_a_mysql_db_param: true
      register: n3
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "N3 failed={{ n3.failed | default('none') }} changed={{ n3.changed | default('none') }}"

    - name: "N4 mysql_db state=present with no server to connect to"
      community.mysql.mysql_db:
        name: krikri
        state: present
        login_host: 127.0.0.1
        login_port: 13399
        login_user: krikri
        login_password: krikri
      register: n4
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "N4 failed={{ n4.failed | default('none') }} changed={{ n4.changed | default('none') }}"

    - name: "N5 mysql_db state=dump with no server to connect to"
      community.mysql.mysql_db:
        name: krikri
        state: dump
        target: /tmp/krikri-dump.sql
        login_host: 127.0.0.1
        login_port: 13399
        login_user: krikri
        login_password: krikri
      register: n5
      ignore_errors: true
    - ansible.builtin.debug:
        msg: "N5 failed={{ n5.failed | default('none') }} changed={{ n5.changed | default('none') }}"
