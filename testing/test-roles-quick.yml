# Roles smoke test - safe under --check and for real runs: copy target is
# a throwaway /tmp file, everything else is debug.

- name: roles smoke test
  hosts: localhost
  gather_facts: false
  roles:
    - role: greeter
      greeting_target: crystal-ansible
  tasks:
    - name: play's own task runs after roles
      ansible.builtin.debug:
        msg: "SUCCESS: play task ran after role tasks"
