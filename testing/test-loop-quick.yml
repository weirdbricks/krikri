# Loop constructs smoke test - runs entirely on localhost with the debug
# plugin, so it is safe to exercise for real (not just --check).

- name: Loop constructs test
  hosts: localhost
  gather_facts: false

  vars:
    colors: [red, green, blue]
    color_map:
      one: "1"
      two: "2"
    max_requests: 0
    pools:
      - name: www
        pm_max_requests: "{{ max_requests }}"

  tasks:
    - name: loop over a plain list
      ansible.builtin.debug:
        msg: "loop item: {{ item }}"
      loop: [a, b, c]
      register: loop_result

    - name: show aggregated loop results
      ansible.builtin.debug:
        msg: "changed={{ loop_result.changed }}"

    - name: with_items over a plain list
      ansible.builtin.debug:
        msg: "with_items item: {{ item }}"
      with_items: [x, y]

    - name: with_dict over a mapping
      ansible.builtin.debug:
        msg: "{{ item.key }}={{ item.value }}"
      with_dict:
        one: "1"
        two: "2"

    - name: with_nested cartesian product
      ansible.builtin.debug:
        msg: "nested item: {{ item }}"
      with_nested:
        - [a, b]
        - [x, y]

    - name: with_sequence numeric range
      ansible.builtin.debug:
        msg: "sequence item: {{ item }}"
      with_sequence: "start=1 end=3"

    - name: with_indexed_items pairs index with value
      ansible.builtin.debug:
        msg: "indexed item: {{ item }}"
      with_indexed_items: [x, y]

    - name: loop over a variable reference
      ansible.builtin.debug:
        msg: "var loop item: {{ item }}"
      loop: "{{ colors }}"

    - name: with_dict over a variable reference
      ansible.builtin.debug:
        msg: "var dict: {{ item.key }}={{ item.value }}"
      with_dict: "{{ color_map }}"

    - name: a loop item's own value that's a bare {{ var }} reference keeps var's native type
      # Real bug found benchmarking geerlingguy.php: a loop item field
      # whose raw value is exactly one bare "{{ ... }}" expression (no
      # surrounding text) referencing an int/bool var previously always
      # stringified to text once rendered, so `default(fallback, true)`
      # downstream could never see it as falsy the way the real
      # underlying value (e.g. int 0) is.
      ansible.builtin.debug:
        msg: "max_requests={{ item.pm_max_requests | default(500, true) }}"
      with_items: "{{ pools }}"

    - name: SUCCESS
      ansible.builtin.debug:
        msg: "Loop constructs tests complete!"
