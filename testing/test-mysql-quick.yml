# mysql_db:/mysql_user: smoke test. Requires a real MySQL/MariaDB server
# reachable at 127.0.0.1:13306 (root/rootpass) - same convention as
# test-docker-quick.yml: targets "testservers" so a --check run against
# the generic empty inventory skips the whole play rather than needing a
# real server.

- name: mysql plugins test
  hosts: testservers
  gather_facts: false

  vars:
    test_db: crystal_ansible_test_db
    test_user: crystal_ansible_test_user
    login_host: 127.0.0.1
    login_port: 13306
    login_user: root
    login_password: rootpass

  tasks:
    - name: ensure the test database is present
      community.mysql.mysql_db:
        name: "{{ test_db }}"
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: db_first

    - name: ensure the test database is present (idempotent)
      community.mysql.mysql_db:
        name: "{{ test_db }}"
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: db_idempotent

    - name: create the test user with privileges
      community.mysql.mysql_user:
        name: "{{ test_user }}"
        host: "%"
        password: secret123
        priv: "{{ test_db }}.*:SELECT,INSERT"
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: user_first

    - name: create the test user with privileges (idempotent)
      community.mysql.mysql_user:
        name: "{{ test_user }}"
        host: "%"
        priv: "{{ test_db }}.*:SELECT,INSERT"
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: user_idempotent

    - name: write the seed SQL
      ansible.builtin.copy:
        content: |
          CREATE TABLE IF NOT EXISTS t (id INT PRIMARY KEY, name VARCHAR(50));
          INSERT INTO t VALUES (1, 'alice'), (2, 'bob');
        dest: /tmp/crystal-ansible-mysql-seed.sql

    - name: import the seed data
      community.mysql.mysql_db:
        name: "{{ test_db }}"
        state: import
        target: /tmp/crystal-ansible-mysql-seed.sql
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: db_import

    - name: dump the database, gzip-compressed
      community.mysql.mysql_db:
        name: "{{ test_db }}"
        state: dump
        target: /tmp/crystal-ansible-mysql-dump.sql.gz
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: db_dump

    - name: create a second database to restore the dump into
      community.mysql.mysql_db:
        name: "{{ test_db }}_restored"
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"

    - name: import the gzip-compressed dump into the second database
      community.mysql.mysql_db:
        name: "{{ test_db }}_restored"
        state: import
        target: /tmp/crystal-ansible-mysql-dump.sql.gz
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: db_import_gz

    - name: verify the restored data round-tripped correctly
      ansible.builtin.shell: >-
        mysql --host={{ login_host }} --port={{ login_port }} --user={{ login_user }}
        --password={{ login_password }} -N -e "SELECT COUNT(*) FROM {{ test_db }}_restored.t"
      register: restored_count
      changed_when: false

    - name: remove the second database
      community.mysql.mysql_db:
        name: "{{ test_db }}_restored"
        state: absent
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"

    - name: dump the database, zstd-compressed
      community.mysql.mysql_db:
        name: "{{ test_db }}"
        state: dump
        target: /tmp/crystal-ansible-mysql-dump.sql.zst
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: db_dump_zst

    - name: create a third database to restore the zstd-compressed dump into
      community.mysql.mysql_db:
        name: "{{ test_db }}_zst"
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"

    - name: import the zstd-compressed dump into the third database
      community.mysql.mysql_db:
        name: "{{ test_db }}_zst"
        state: import
        target: /tmp/crystal-ansible-mysql-dump.sql.zst
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: db_import_zst

    - name: verify the zstd-restored data round-tripped correctly
      ansible.builtin.shell: >-
        mysql --host={{ login_host }} --port={{ login_port }} --user={{ login_user }}
        --password={{ login_password }} -N -e "SELECT COUNT(*) FROM {{ test_db }}_zst.t"
      register: restored_count_zst
      changed_when: false

    - name: remove the third database
      community.mysql.mysql_db:
        name: "{{ test_db }}_zst"
        state: absent
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"

    - name: change the user's privileges
      community.mysql.mysql_user:
        name: "{{ test_user }}"
        host: "%"
        priv: "{{ test_db }}.*:ALL"
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: user_priv_changed

    - name: remove the test user
      community.mysql.mysql_user:
        name: "{{ test_user }}"
        host: "%"
        state: absent
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: user_removed

    - name: remove the test database
      community.mysql.mysql_db:
        name: "{{ test_db }}"
        state: absent
        login_host: "{{ login_host }}"
        login_port: "{{ login_port }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
      register: db_removed

    - name: show results
      ansible.builtin.debug:
        msg: >-
          db_first={{ db_first.changed }}
          db_idempotent={{ db_idempotent.changed }}
          db_import={{ db_import.changed }}
          db_dump={{ db_dump.changed }}
          db_import_gz={{ db_import_gz.changed }}
          restored_count={{ restored_count.stdout }}
          db_dump_zst={{ db_dump_zst.changed }}
          db_import_zst={{ db_import_zst.changed }}
          restored_count_zst={{ restored_count_zst.stdout }}
          user_first={{ user_first.changed }}
          user_idempotent={{ user_idempotent.changed }}
          user_priv_changed={{ user_priv_changed.changed }}
          user_removed={{ user_removed.changed }}
          db_removed={{ db_removed.changed }}

    - name: SUCCESS
      ansible.builtin.debug:
        msg: "mysql plugins smoke test complete!"
