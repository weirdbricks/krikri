---
# Remote Host Test - Crystal Play
# Tests SSH connection, plugin execution, and various modules

- name: Test Remote Host Operations
  hosts: testservers
  gather_facts: false
  
  tasks:
    - name: Test 1 - Ping via command
      ansible.builtin.command: echo "pong"
      register: ping_result
    
    - name: Show ping result
      ansible.builtin.debug:
        msg: "Ping response: {{ ping_result.stdout }}"
    
    - name: Test 2 - Create test directory
      ansible.builtin.file:
        path: /tmp/crystal-play-remote-test
        state: directory
        mode: '0755'
    
    - name: Test 3 - Copy file with content
      ansible.builtin.copy:
        content: |
          Crystal Play Remote Test
          =========================
          Timestamp: {{ ansible_date_time.iso8601 }}
          Host: {{ inventory_hostname }}
        dest: /tmp/crystal-play-remote-test/test.txt
        mode: '0644'
    
    - name: Test 4 - Verify file exists
      ansible.builtin.command: cat /tmp/crystal-play-remote-test/test.txt
      register: file_content
    
    - name: Show file content
      ansible.builtin.debug:
        msg: "File contains: {{ file_content.stdout }}"
    
    - name: Test 5 - Create another file via shell
      ansible.builtin.shell: echo "Created via shell" > /tmp/crystal-play-remote-test/shell-test.txt
    
    - name: Test 6 - List test directory
      ansible.builtin.shell: ls -la /tmp/crystal-play-remote-test/
      register: dir_listing
    
    - name: Show directory listing
      ansible.builtin.debug:
        var: dir_listing.stdout_lines
    
    - name: Test 7 - Modify file ownership (demonstrates file module)
      ansible.builtin.file:
        path: /tmp/crystal-play-remote-test/test.txt
        mode: '0600'
    
    - name: Test 8 - Verify permission change
      ansible.builtin.shell: stat -c '%a' /tmp/crystal-play-remote-test/test.txt
      register: perms
    
    - name: Show permissions
      ansible.builtin.debug:
        msg: "File permissions: {{ perms.stdout }}"
    
    - name: Test 9 - Cleanup test directory
      ansible.builtin.file:
        path: /tmp/crystal-play-remote-test
        state: absent
    
    - name: Test 10 - Verify cleanup
      ansible.builtin.shell: "[ ! -d /tmp/crystal-play-remote-test ] && echo 'CLEANED' || echo 'STILL EXISTS'"
      register: cleanup_check
    
    - name: Show cleanup result
      ansible.builtin.debug:
        msg: "Cleanup status: {{ cleanup_check.stdout }}"
    
    - name: SUCCESS
      ansible.builtin.debug:
        msg: "🎉 All remote tests passed!"
