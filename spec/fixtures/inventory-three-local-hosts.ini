# Three distinctly-named local-connection hosts, so run_once: failure
# propagation (a failed run_once task must halt every host in the play)
# can be exercised for real without needing three machines to SSH into -
# PluginManager treats ansible_connection=local as "run right here"
# regardless of the host's inventory name. The "threelocal" group is
# what testing/test-run-once-fail-quick.yml targets.
[threelocal]
nodea ansible_connection=local
nodeb ansible_connection=local
nodec ansible_connection=local
