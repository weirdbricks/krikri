# Two distinct inventory host aliases, both ansible_connection=local, plus
# TEMPLATED group-level vars - the shape real multi-host roles use for
# per-host computed values (`who: "{{ myname }}"`).
[hostvars_scope]
h1 ansible_connection=local myname=one
h2 ansible_connection=local myname=two

[hostvars_scope:vars]
who="{{ myname }}"
nm="{{ inventory_hostname }}"
cfg_a="{{ myname }}-cfg"
lst=['{{ myname }}-1', '{{ myname }}-2']
