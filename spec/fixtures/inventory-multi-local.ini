# Two-host inventory where both hosts are actually local connections
# (ansible_connection=local), so multi-host behavior (run_once:,
# delegate_to:) can be exercised for real without needing a second real
# machine to SSH into - PluginManager treats ansible_connection=local as
# "run right here" regardless of the host's inventory name.
[multilocal]
web1 ansible_connection=local
web2 ansible_connection=local
