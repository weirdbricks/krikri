# A "testservers" group pointed at a local connection, so a fixture that
# needs the "testservers" convention (skipped under the generic empty
# inventory used by every other testing/*.yml fixture, matching
# test-copy.yml/test-package.yml/etc.) can still be driven for real in a
# dedicated integration spec without a second machine to SSH into.
[testservers]
localhost ansible_connection=local
