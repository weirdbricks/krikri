# Run `ameba --only Metrics/CyclomaticComplexity` for details
Metrics/CyclomaticComplexity:
  Description: Disallows methods with a cyclomatic complexity higher than `MaxComplexity`
  MaxComplexity: 10
  Excluded:
  # Faithful ports of real Ansible's own long branch chains - the
  # branch count IS the specification (parse_distribution_file_Debian's
  # ordered substring tests; the debugger prompt's command set), and
  # splitting them up would obscure the correspondence the corpus
  # differential in distribution_facts_spec.cr checks against.
  - src/krikri/plugin_helpers/distribution_facts.cr
  # PackageCoalescer's disqualifier predicates are a flat list of "ways
  # a package task can depend on running separately". The branch count
  # IS the safety argument (item 11 is parity-BREAKING, so every missing
  # branch is a way to merge something that should not be merged), and
  # splitting past the two it already has would scatter one rule across
  # four methods for no gain. Already reduced 25 -> 12.
  - src/krikri/package_coalescer.cr
  - src/krikri/task_debugger.cr
