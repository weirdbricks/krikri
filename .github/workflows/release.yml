name: Release

# Triggered by pushing a tag like v0.9.646. Builds a release (optimized +
# stripped, fully static via Alpine/musl) binary set per architecture
# and attaches them to the matching GitHub Release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # Alpine (musl) rather than the glibc image: --static below produces
    # a binary with NO runtime libc dependency at all, so it runs on
    # any Linux host regardless of glibc version - the usual reason to
    # ship musl-static release binaries for a CLI tool. This is a
    # multi-arch image, so the same tag pulls the right variant on both
    # the x86_64 and arm64 (ubuntu-24.04-arm) runners unchanged.
    container:
      image: crystallang/crystal:1.20.3-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apk add --no-cache \
            bash git grep file binutils \
            pcre2-dev pcre2-static \
            openssl-dev openssl-libs-static \
            bzip2-dev bzip2-static \
            xz-dev xz-libs \
            zlib-dev zlib-static \
            gc-dev gc-static \
            libunwind-dev libunwind-static

      - name: Install shards
        run: shards install

      - name: Build release binaries
        run: ./build.sh --release --static

      - name: Package
        run: |
          PKG="krikri-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          mkdir -p "dist/${PKG}"
          cp -r bin/* "dist/${PKG}/"
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: krikri-linux-${{ matrix.arch }}
          path: dist/*.tar.gz

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
