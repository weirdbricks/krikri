name: Release

# Triggered by pushing a tag like v0.9.646, or dispatched by auto-tag.yml
# (which cannot trigger this by pushing the tag itself - a push made with
# the workflow's own GITHUB_TOKEN never starts another workflow, GitHub's
# anti-recursion rule - so auto-tag dispatches this explicitly instead).
# Builds a release (optimized +
# stripped, fully static via Alpine/musl) binary set per architecture
# and attaches them to the matching GitHub Release.
#
# The SAME anti-recursion rule bites this workflow's own "Commit and
# push" step below (Formula/krikri.rb + README bump): that push also
# rides the default GITHUB_TOKEN, so brew-test.yml's `push: paths:
# Formula/krikri.rb` trigger silently never fires after a real release -
# found live confirming the v0.9.738 release (0.9.738), the same class
# of gap auto-tag.yml's own comment already documents for this
# workflow. Worked around the same way: dispatch brew-test.yml
# explicitly right after the formula push succeeds.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # dispatching brew-test.yml below

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Alpine (musl) rather than the glibc image: --static below
      # produces a binary with NO runtime libc dependency at all, so it
      # runs on any Linux host regardless of glibc version - the usual
      # reason to ship musl-static release binaries for a CLI tool.
      # Invoked via plain `docker run` (not a job-level `container:`)
      # because GitHub's JS-based actions (checkout/upload-artifact)
      # can't run inside an Alpine container on an arm64 runner ("only
      # supported on x64 Linux runners") - found live on the first
      # arm64 attempt. Running checkout/upload on the bare (glibc)
      # runner and only the actual build inside Alpine sidesteps that
      # for both architectures uniformly. The image is multi-arch, so
      # the same tag pulls the right variant on both runners unchanged.
      # Packaging (cp -al + tar) happens INSIDE this same container, as
      # the same (root) user that built bin/ - not as a separate
      # host-side step. GitHub Actions' Docker runs the container as
      # real root (unlike a rootless-podman dev box, where the
      # container's root maps back to the host user), so bin/* comes
      # out root-owned; a later host-side step running as the
      # unprivileged `runner` user then can't hardlink to those files
      # at all (Linux's fs.protected_hardlinks blocks a non-owner from
      # hardlinking someone else's file: "Operation not permitted",
      # found live on the first attempt). Doing cp -al/tar here, still
      # as root, sidesteps the ownership boundary entirely. Reading the
      # finished .tar.gz back out as the host `runner` user afterward
      # is fine - no hardlink involved, just a normal file read.
      - name: Build release binaries (Alpine/musl, static)
        run: |
          PKG="krikri-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          docker run --rm -v "$PWD:/repo" -w /repo crystallang/crystal:1.20.3-alpine sh -c "
            set -e
            apk add --no-cache \
              bash git grep file binutils \
              pcre2-dev pcre2-static \
              openssl-dev openssl-libs-static \
              bzip2-dev bzip2-static \
              xz-dev xz-libs \
              zlib-dev zlib-static \
              gc-dev gc-static \
              libunwind-dev libunwind-static
            shards install
            ./build.sh --release --static
            # -al (hardlink, not copy): bin/plugins/.fat-plugin is
            # hardlinked under 96 plugin names sharing one inode - a
            # plain 'cp -r' doesn't preserve that and turns each name
            # into its own full ~10M copy, bloating the tarball to
            # ~400M instead of the real ~50-70M.
            mkdir -p 'dist/${PKG}'
            cp -al bin/* 'dist/${PKG}/'
            tar -C dist -czf 'dist/${PKG}.tar.gz' '${PKG}'
            ls -lh 'dist/${PKG}.tar.gz'
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: krikri-linux-${{ matrix.arch }}
          path: dist/*.tar.gz

  build-macos:
    name: Build (macOS ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crystal
        run: brew install crystal

      # --without-development: ameba (a dev-only lint dependency, unused
      # by the release binaries themselves) has its own `shards build`
      # postinstall hook that broke against a newer Crystal it doesn't
      # yet support (confirmed live: v0.9.687's macOS x86_64 job pulled
      # Crystal 1.21.0 via Homebrew - a different bottle than arm64's
      # 1.20.2 - and ameba 1.6.4's postinstall failed with "undefined
      # method 'next_string_array_token' for Crystal::Lexer"). Skipping
      # it entirely for release builds sidesteps that fragility rather
      # than pinning to a specific Crystal version.
      - name: Install deps
        run: shards install --without-development

      # Not statically linked - unlike the Linux musl build above,
      # macOS has no equivalent fully-static toolchain, so this links
      # against the Homebrew-installed libs (pcre2, openssl, gc, ...)
      # on the build runner. Fine for a Homebrew-distributed binary,
      # since Homebrew guarantees those same libs on the install
      # machine too.
      - name: Build release binaries
        run: |
          PKG="krikri-${GITHUB_REF_NAME}-darwin-${{ matrix.arch }}"
          ./build.sh --release
          mkdir -p "dist/${PKG}"
          # -l (hardlink, not copy): see the Linux job's own comment above -
          # bin/plugins/.fat-plugin is hardlinked under 96 plugin names
          # sharing one inode. BSD cp (macOS) supports -l the same as GNU.
          cp -al bin/* "dist/${PKG}/"
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
          ls -lh "dist/${PKG}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: krikri-darwin-${{ matrix.arch }}
          path: dist/*.tar.gz

  release:
    name: Publish release
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    steps:
      # Checked out first, before "Download artifacts" populates dist/ -
      # actions/checkout runs `git clean -ffdx` on the workspace by
      # default, which would delete those untracked tarballs if it ran
      # afterward instead.
      - name: Checkout (for later pushing the formula update)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Formula/krikri.rb hardcodes this tag's version/url/sha256 for all
      # 4 assets - without this, every release leaves it silently
      # pointing at the previous release until someone remembers to bump
      # it by hand. Regenerated from a template rather than sed-patched
      # in place, so a change to the formula's structure (a new
      # depends_on, say) doesn't get clobbered by a future auto-bump -
      # only the version/url/sha256 lines are templated.
      - name: Update Formula/krikri.rb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          declare -A SHA
          for f in dist/*.tar.gz; do
            SHA[$(basename "$f")]=$(sha256sum "$f" | cut -d' ' -f1)
          done
          asset() { echo "krikri-${GITHUB_REF_NAME}-$1.tar.gz"; }
          sha() { echo "${SHA[$(asset "$1")]}"; }

          cat > Formula/krikri.rb <<EOF
          class Krikri < Formula
            desc "Ansible-compatible automation tool, written in Crystal"
            homepage "https://github.com/weirdbricks/krikri"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/weirdbricks/krikri/releases/download/${GITHUB_REF_NAME}/$(asset darwin-arm64)"
                sha256 "$(sha darwin-arm64)"
              else
                url "https://github.com/weirdbricks/krikri/releases/download/${GITHUB_REF_NAME}/$(asset darwin-x86_64)"
                sha256 "$(sha darwin-x86_64)"
              end

              # Unlike the Linux binaries (fully static musl builds, zero runtime
              # deps), the macOS binaries are dynamically linked against these at
              # their Homebrew-installed paths (confirmed via the release build's
              # own link command: -lgc/-lpcre2-8 resolve to
              # /opt/homebrew/opt/{bdw-gc,pcre2}, -lssl/-lcrypto to openssl@3) -
              # without them declared here, a fresh \`brew install\` never pulls
              # them in and krikri-playbook fails at dyld load time (confirmed
              # live: "Library not loaded: .../bdw-gc/lib/libgc.1.dylib"). libz/
              # libbz2/liblzma/libiconv/libutil are all system-provided on macOS,
              # no formula needed for those.
              depends_on "openssl@3"
              depends_on "pcre2"
              depends_on "bdw-gc"
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/weirdbricks/krikri/releases/download/${GITHUB_REF_NAME}/$(asset linux-arm64)"
                sha256 "$(sha linux-arm64)"
              else
                url "https://github.com/weirdbricks/krikri/releases/download/${GITHUB_REF_NAME}/$(asset linux-x86_64)"
                sha256 "$(sha linux-x86_64)"
              end
            end

            # Each Ansible module is its own small binary, dispatched from
            # src/krikri/plugin_manager.cr#get_local_plugin_path by resolving a
            # "plugins" directory next to krikri-playbook's own (symlink-resolved)
            # executable path - so plugins/ must land in the same Cellar bin/ dir
            # as the two top-level binaries, not the usual libexec/share split.
            def install
              bin.install "krikri-playbook"
              bin.install "krikri"
              bin.install "plugins"
            end

            test do
              assert_match "krikri #{version}", shell_output("#{bin}/krikri-playbook --version")
            end
          end
          EOF

      # README's Version badge (found stale at 0.9.646 while several
      # releases had already shipped past it - it used to only get
      # bumped by hand as part of a benchmark round's docs commit) is
      # now kept current the same way the formula is: regenerated every
      # release rather than relying on someone to remember.
      - name: Update README version badge
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i -E "s#(badge/version-)[^-]+(-blue)#\1${VERSION}\2#" README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/krikri.rb README.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update Formula/krikri.rb and README version badge for ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi

      # This push rides the default GITHUB_TOKEN, so it does NOT trigger
      # brew-test.yml's own `push: paths: Formula/krikri.rb` filter -
      # same GitHub anti-recursion rule this file's own top comment
      # documents for auto-tag.yml's tag push. Dispatch it explicitly so
      # every real release still gets the formula verified on all 4
      # platforms, not just on a manual run someone remembers to kick off.
      - name: Dispatch brew-test.yml (push-triggered dispatch doesn't fire for a GITHUB_TOKEN push)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run brew-test.yml --ref main
