name: Release

# Triggered by pushing a tag like v0.9.646. Builds a release (optimized +
# stripped, fully static via Alpine/musl) binary set per architecture
# and attaches them to the matching GitHub Release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Alpine (musl) rather than the glibc image: --static below
      # produces a binary with NO runtime libc dependency at all, so it
      # runs on any Linux host regardless of glibc version - the usual
      # reason to ship musl-static release binaries for a CLI tool.
      # Invoked via plain `docker run` (not a job-level `container:`)
      # because GitHub's JS-based actions (checkout/upload-artifact)
      # can't run inside an Alpine container on an arm64 runner ("only
      # supported on x64 Linux runners") - found live on the first
      # arm64 attempt. Running checkout/upload on the bare (glibc)
      # runner and only the actual build inside Alpine sidesteps that
      # for both architectures uniformly. The image is multi-arch, so
      # the same tag pulls the right variant on both runners unchanged.
      # Packaging (cp -al + tar) happens INSIDE this same container, as
      # the same (root) user that built bin/ - not as a separate
      # host-side step. GitHub Actions' Docker runs the container as
      # real root (unlike a rootless-podman dev box, where the
      # container's root maps back to the host user), so bin/* comes
      # out root-owned; a later host-side step running as the
      # unprivileged `runner` user then can't hardlink to those files
      # at all (Linux's fs.protected_hardlinks blocks a non-owner from
      # hardlinking someone else's file: "Operation not permitted",
      # found live on the first attempt). Doing cp -al/tar here, still
      # as root, sidesteps the ownership boundary entirely. Reading the
      # finished .tar.gz back out as the host `runner` user afterward
      # is fine - no hardlink involved, just a normal file read.
      - name: Build release binaries (Alpine/musl, static)
        run: |
          PKG="krikri-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          docker run --rm -v "$PWD:/repo" -w /repo crystallang/crystal:1.20.3-alpine sh -c "
            set -e
            apk add --no-cache \
              bash git grep file binutils \
              pcre2-dev pcre2-static \
              openssl-dev openssl-libs-static \
              bzip2-dev bzip2-static \
              xz-dev xz-libs \
              zlib-dev zlib-static \
              gc-dev gc-static \
              libunwind-dev libunwind-static
            shards install
            ./build.sh --release --static
            # -al (hardlink, not copy): bin/plugins/.fat-plugin is
            # hardlinked under 96 plugin names sharing one inode - a
            # plain 'cp -r' doesn't preserve that and turns each name
            # into its own full ~10M copy, bloating the tarball to
            # ~400M instead of the real ~50-70M.
            mkdir -p 'dist/${PKG}'
            cp -al bin/* 'dist/${PKG}/'
            tar -C dist -czf 'dist/${PKG}.tar.gz' '${PKG}'
            ls -lh 'dist/${PKG}.tar.gz'
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: krikri-linux-${{ matrix.arch }}
          path: dist/*.tar.gz

  build-macos:
    name: Build (macOS ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crystal
        run: brew install crystal

      - name: Install deps
        run: shards install

      # Not statically linked - unlike the Linux musl build above,
      # macOS has no equivalent fully-static toolchain, so this links
      # against the Homebrew-installed libs (pcre2, openssl, gc, ...)
      # on the build runner. Fine for a Homebrew-distributed binary,
      # since Homebrew guarantees those same libs on the install
      # machine too.
      - name: Build release binaries
        run: |
          PKG="krikri-${GITHUB_REF_NAME}-darwin-${{ matrix.arch }}"
          ./build.sh --release
          mkdir -p "dist/${PKG}"
          cp -a bin/* "dist/${PKG}/"
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
          ls -lh "dist/${PKG}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: krikri-darwin-${{ matrix.arch }}
          path: dist/*.tar.gz

  release:
    name: Publish release
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
