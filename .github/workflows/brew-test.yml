name: Brew Formula Test

# Verifies Formula/krikri.rb actually installs and runs on every platform
# it targets. Triggered manually and on any change to the formula itself
# (a bumped url/sha256/version is exactly the kind of edit likely to be
# wrong until proven otherwise on a real runner).

on:
  workflow_dispatch: {}
  push:
    paths:
      - "Formula/krikri.rb"
      - "Formula/krikri-multiarch.rb"

jobs:
  brew-test:
    name: brew install (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      # fetch-depth: 0 (complete history): `brew tap <name> "$GITHUB_WORKSPACE"`
      # clones this checkout as a local tap, and Homebrew unshallows that
      # clone before installing the multiarch formula ("==> Unshallowing
      # weirdbricks/krikri"). The default depth-1 checkout only carries the
      # tag commit's refs, so on a tag push that fetch has no branch to
      # resolve and fails - "git ... fetch --unshallow exited with 1" -
      # turning Brew Formula Test red on releases (v0.9.2484, v0.9.2485).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Linuxbrew isn't preinstalled on GitHub's Ubuntu runners (unlike
      # Homebrew, which is preinstalled on the macOS ones) - confirmed
      # live, "brew: command not found".
      - name: Install Homebrew (Linux only)
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@main

      # Modern Homebrew rejects a bare untapped formula file outright
      # ("Homebrew requires formulae to be in a tap", confirmed live) -
      # `brew install --formula <path>` no longer works at all. Tapping
      # this checkout directly (a local path is a valid tap URL) matches
      # what a real user's `brew tap weirdbricks/krikri
      # https://github.com/weirdbricks/krikri` does, without needing a
      # network fetch of this same commit.
      - name: Tap this checkout and install
        run: |
          brew tap weirdbricks/krikri "$GITHUB_WORKSPACE"
          brew install weirdbricks/krikri/krikri

      - name: brew test
        run: brew test weirdbricks/krikri/krikri

      - name: Sanity-check the installed binary directly
        run: krikri-playbook --version

      # The multiarch bundle is a macOS controller build (its Mach-O
      # binaries cannot run on the Linux runners, and a Linux controller
      # has no use for its extra Linux plugin sets anyway).
      #
      # It is an ALTERNATIVE to the default formula, not a co-install:
      # both ship the same bin/krikri and bin/krikri-playbook names, so
      # installing it while `krikri` is still linked fails `brew link`
      # ("Target /opt/homebrew/bin/krikri is a symlink belonging to
      # krikri") - found live on the first run of these steps, which
      # had never completed before (the Oct 31 runs were cancelled
      # alongside the red CI). Unlink the default formula first; the
      # sanity check below then exercises the multiarch binary itself.
      - name: Tap this checkout and install the multiarch bundle (macOS only)
        if: runner.os == 'macOS'
        run: |
          brew tap weirdbricks/krikri "$GITHUB_WORKSPACE"
          brew unlink krikri
          brew install weirdbricks/krikri/krikri-multiarch

      - name: brew test (multiarch)
        if: runner.os == 'macOS'
        run: brew test weirdbricks/krikri/krikri-multiarch

      - name: Sanity-check the installed multiarch binary directly
        if: runner.os == 'macOS'
        run: |
          krikri-playbook --version
          test -n "$(ls "$(brew --prefix)/opt/krikri-multiarch/bin/plugins-linux-x86_64")"
          test -n "$(ls "$(brew --prefix)/opt/krikri-multiarch/bin/plugins-linux-aarch64")"
