name: Brew Formula Test

# Verifies Formula/krikri.rb actually installs and runs on every platform
# it targets. Triggered manually and on any change to the formula itself
# (a bumped url/sha256/version is exactly the kind of edit likely to be
# wrong until proven otherwise on a real runner).

on:
  workflow_dispatch: {}
  push:
    paths:
      - "Formula/krikri.rb"

jobs:
  brew-test:
    name: brew install (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Linuxbrew isn't preinstalled on GitHub's Ubuntu runners (unlike
      # Homebrew, which is preinstalled on the macOS ones) - confirmed
      # live, "brew: command not found".
      - name: Install Homebrew (Linux only)
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@master

      # Modern Homebrew rejects a bare untapped formula file outright
      # ("Homebrew requires formulae to be in a tap", confirmed live) -
      # `brew install --formula <path>` no longer works at all. Tapping
      # this checkout directly (a local path is a valid tap URL) matches
      # what a real user's `brew tap weirdbricks/krikri
      # https://github.com/weirdbricks/krikri` does, without needing a
      # network fetch of this same commit.
      - name: Tap this checkout and install
        run: |
          brew tap weirdbricks/krikri "$GITHUB_WORKSPACE"
          brew install weirdbricks/krikri/krikri

      - name: brew test
        run: brew test weirdbricks/krikri/krikri

      - name: Sanity-check the installed binary directly
        run: krikri-playbook --version
