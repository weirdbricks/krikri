name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: crystallang/crystal:1.20.3

    steps:
      - uses: actions/checkout@v4

      - name: Install system libs (liblzma-dev)
        # Crystal's stdlib links against liblzma via pkg-config; without
        # the dev package + pkg-config file present, `pkg-config --libs
        # liblzma` fails and the shell fallback in Crystal's own @[Link]
        # annotation kicks in - but that fallback string is the invalid
        # linker flag "--llzma" (double-dash) instead of "-llzma", which
        # cc rejects outright ("unrecognized command-line option
        # '--llzma'"), failing the whole build. Installing the real
        # dev package here means pkg-config succeeds and that broken
        # fallback is never reached at all.
        run: apt-get update -qq && apt-get install -y -qq liblzma-dev

      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: lib
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.lock') }}
          restore-keys: |
            ${{ runner.os }}-shards-

      - name: Install dependencies
        run: shards install

      - name: Build main executable and plugins
        run: ./build.sh

      - name: Run specs
        run: crystal spec

      - name: Lint (ameba)
        # Invoke the dependency's own binary directly rather than ./bin/ameba:
        # that symlink is only (re)created by shards' postinstall hook on a
        # fresh install, so it can go missing on a cache hit for lib/.
        run: lib/ameba/bin/ameba
