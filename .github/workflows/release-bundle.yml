name: Release multi-arch bundle

# Adds krikri-<tag>-linux-multiarch.tar.gz (x86_64 + aarch64 controllers
# and plugin sets in one tarball) and krikri-<tag>-darwin-multiarch.tar.gz
# (both Mac controllers plus the Linux plugin sets they upload to Linux targets) to a published release, built from that
# release's own two Linux tarballs. Dispatched by release.yml's last step
# (a workflow_run trigger never fires for GITHUB_TOKEN-started runs), or
# manually for any existing tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: latest release)"
        required: false

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and upload bundle
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG=$(gh release view --json tagName --jq .tagName)
          mkdir -p dl out
          gh release download "$TAG" -D dl -p '*-linux-x86_64.tar.gz' -p '*-linux-arm64.tar.gz' -p '*-darwin-x86_64.tar.gz' -p '*-darwin-arm64.tar.gz'
          scripts/make-multiarch-bundle.sh "$TAG" dl out
          scripts/make-darwin-multiarch-bundle.sh "$TAG" dl out
          gh release upload "$TAG" out/*.tar.gz --clobber
