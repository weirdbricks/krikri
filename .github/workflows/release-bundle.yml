name: Release multi-arch bundle

# Adds krikri-<tag>-linux-multiarch.tar.gz (x86_64 + aarch64 controllers
# and plugin sets in one tarball) and krikri-<tag>-darwin-with-linux-multiarch.tar.gz
# (both Mac controllers plus the Linux plugin sets they upload to Linux targets) to a published release, built from that
# release's own two Linux tarballs. Dispatched by release.yml's last step
# (a workflow_run trigger never fires for GITHUB_TOKEN-started runs), or
# manually for any existing tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: latest release)"
        required: false

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and upload bundle
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG=$(gh release view --json tagName --jq .tagName)
          mkdir -p dl out
          gh release download "$TAG" -D dl -p '*-linux-x86_64.tar.gz' -p '*-linux-arm64.tar.gz' -p '*-darwin-x86_64.tar.gz' -p '*-darwin-arm64.tar.gz'
          scripts/make-multiarch-bundle.sh "$TAG" dl out
          scripts/make-darwin-with-linux-multiarch-bundle.sh "$TAG" dl out
          gh release upload "$TAG" out/*.tar.gz --clobber

      # Formula/krikri-multiarch.rb must pin the bundle's real sha256 -
      # release.yml cannot do it (the bundle does not exist yet when it
      # runs), which left sha256 "" and Homebrew unable to verify the
      # download (issue #841). Now that the bundle is uploaded, hash it
      # and patch the formula's three version-bearing lines. A manual
      # re-dispatch for an older tag just re-pins the same values.
      - name: Update Formula/krikri-multiarch.rb
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG=$(gh release view --json tagName --jq .tagName)
          VERSION="${TAG#v}"
          ASSET="krikri-${TAG}-darwin-with-linux-multiarch.tar.gz"
          SHA=$(sha256sum "out/${ASSET}" | cut -d' ' -f1)
          test -n "$SHA" || { echo "empty sha256 for $ASSET"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          sed -i -E \
            -e "s#^  version \".*\"#  version \"${VERSION}\"#" \
            -e "s#^  url \".*darwin-with-linux-multiarch.tar.gz\"#  url \"https://github.com/weirdbricks/krikri/releases/download/${TAG}/${ASSET}\"#" \
            -e "s#^  sha256 \".*\"#  sha256 \"${SHA}\"#" \
            Formula/krikri-multiarch.rb
          git add Formula/krikri-multiarch.rb
          if git diff --cached --quiet; then
            echo "Formula/krikri-multiarch.rb already up to date."
          else
            git commit -m "Update krikri-multiarch formula for ${TAG}"
            git push origin HEAD:main
          fi
