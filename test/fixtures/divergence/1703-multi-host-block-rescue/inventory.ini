# One host the eager pass cannot reach, one it can: only the unreachable
# one is out of the play; rescue:/always: still serve the healthy host.
target ansible_connection=ssh ansible_host=192.0.2.1 ansible_user=root ansible_python_interpreter=/usr/bin/python3 ansible_ssh_executable=./always-fail
good ansible_connection=local ansible_python_interpreter=/usr/bin/python3
