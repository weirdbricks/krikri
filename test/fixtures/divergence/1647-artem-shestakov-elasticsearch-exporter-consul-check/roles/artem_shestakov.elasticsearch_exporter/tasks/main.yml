---
# The role's tasks/service_consul.yml, the file its main.yml includes last,
# trimmed to the one task this round diverged on: the two tasks above it
# install python3 and python-consul, which a localhost capture must not
# mutate (and they never decide this divergence, which is the consul task's
# own check-mode skip). The main.yml tasks above the include (get_url,
# unarchive, copy, template, systemd) are dropped whole - real's --check run
# of them needs the downloaded tarball, which a capture must not fetch.
- name: Register Elasticsearch service with the local consul agent
  community.general.consul:
    host: "{{ consul_host }}"
    service_name: "{{ consul_service_name }}"
    service_port: "{{ consul_service_port }}"
    interval: "{{ consul_service_interval }}"
    tags: "{{ consul_service_tags }}"
