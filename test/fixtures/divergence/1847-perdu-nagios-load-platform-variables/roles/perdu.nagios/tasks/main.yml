---
# tasks file for ansible-role-nagios
- name: Load platform variables
  ansible.builtin.include_vars:
    file: "{{ lookup('first_found', platform_vars_files, errors='ignore') }}"
  vars:
    platform_vars_files:
      files:
        - "{{ role_path }}/vars/{{ ansible_facts['distribution'] | lower }}/\
           {{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ role_path }}/vars/{{ ansible_facts['distribution'] | lower }}/main.yml"
        - "{{ role_path }}/vars/{{ ansible_facts['os_family'] | lower }}/main.yml"
        - "{{ role_path }}/vars/main.yml"
