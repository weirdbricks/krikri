[local]
localctl ansible_connection=local ansible_python_interpreter=/usr/bin/python3
# The interpreter pin keeps ansible's interpreter discovery off the target's
# ssh usage: discovery is its own exec and its failure renders a different
# block shape than the module exec's (live-verified vs 2.21.6), and krikri
# does not model the discovery exec here. With the pin the module dispatch is
# the host's FIRST ssh usage, which is the issue's scenario.
target ansible_connection=ssh ansible_host=192.0.2.1 ansible_user=root ansible_python_interpreter=/usr/bin/python3 ansible_ssh_executable=./always-fail
