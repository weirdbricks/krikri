# The issue's own task only diverges over a NON-local connection: the
# executor marks a remote dispatch with `__krikri_remote_tty`, and that
# internal marker is what ansible.posix.mount's argument-spec check
# rejected. `flags.txt` runs the case with `-c ssh` (overriding the
# harness's own `-c local`) and `fake-ssh` is a stub transport that runs
# the "remote" command on this same machine - the same shape the corpus's
# `always-fail` helpers already use, only answering instead of failing.
target ansible_host=127.0.0.1 ansible_python_interpreter=/usr/bin/python3 ansible_ssh_executable=./fake-ssh ansible_ssh_transfer_method=piped
