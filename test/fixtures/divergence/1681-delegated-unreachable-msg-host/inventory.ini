good ansible_connection=local ansible_python_interpreter=/usr/bin/python3
# The delegate is the issue's dead endpoint (127.0.0.1:1). `always-fail`
# stands in for that dial so no real host or port is involved, and the
# interpreter pin keeps ansible's interpreter-discovery exec (krikri does
# not model it) from becoming the target's first ssh usage.
dead ansible_connection=ssh ansible_host=127.0.0.1 ansible_port=1 ansible_user=root ansible_python_interpreter=/usr/bin/python3 ansible_ssh_executable=./always-fail
