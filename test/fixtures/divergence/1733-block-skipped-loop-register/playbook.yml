---
# t2d.ansible_role_libvirt_vm's tasks/autodetect.yml "Detect the virtualisation
# emulator" block (lines 31-59), verbatim except for the pinned engine: the
# role's kvm/qemu probes need /dev/kvm and a real emulator, and this case only
# needs the skip path a non-kvm engine takes. libvirt_vm_emulator is pinned to
# the role defaults' null so the outer block runs and the inner one skips.
- name: t2d.ansible_role_libvirt_vm autodetect emulator
  hosts: localhost
  gather_facts: false
  vars:
    libvirt_vm_engine: qemu
    libvirt_vm_emulator:
  tasks:
    - block:
        - block:
            - name: Detect the KVM emulator binary path
              stat:
                path: "{{ item }}"
              register: kvm_emulator_result
              with_items:
                - /usr/bin/kvm
                - /usr/bin/qemu-kvm
                - /usr/libexec/qemu-kvm

            - name: Set a fact containing the KVM emulator binary path
              set_fact:
                libvirt_vm_emulator: "{{ item.item }}"
              with_items: "{{ kvm_emulator_result.results }}"
              when: item.stat.exists
          when: libvirt_vm_engine == 'kvm'
      when: libvirt_vm_emulator is none or libvirt_vm_emulator | length == 0
