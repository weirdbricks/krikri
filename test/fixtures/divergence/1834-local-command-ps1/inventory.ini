# The issue was observed on macOS, whose /bin/sh is bash: a non-interactive
# bash removes PS1 from the environment it hands the module, so ansible's
# module process never sees the controller's prompt. This box's /bin/sh is
# dash, which forwards it - pinning the shell executable reproduces the
# platform the issue was reported on instead of making the case machine-typed.
[local]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3 ansible_shell_executable=/bin/bash
