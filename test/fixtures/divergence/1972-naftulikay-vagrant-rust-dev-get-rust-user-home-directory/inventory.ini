[local]
; `ansible_admin_users` is what decides ansible's wording here: _fixup_perms2
; fails a become to an unprivileged user with "Failed to change ownership of
; the temporary files ..." only when the CONNECTION user is in this list. The
; round reached its Rocky target as root (in the default list); a local
; connection runs as whoever invokes the suite, so the case names that user.
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3 ansible_admin_users="{{ [lookup('env', 'USER')] }}"
