---
# kpg 000020-multi-pacman-chaos #20.0, the Pacman task verbatim - under
# --check. `remove_nosave` carries a non-boolean string, so the task dies
# in argument-spec validation (before Pacman.__init__'s get_bin_path
# probe), which is host-independent.
- name: 'Krikri-playbook-generator: multi-task #20'
  hosts: kpg_targets
  gather_facts: false
  tasks:
    - name: 'Pacman #20.0'
      community.general.pacman:
        force: false
        reason: explicit
        remove_nosave: wwxxse
        update_cache: pklpcv
        upgrade_extra_args: glqyai
      register: kpg_task_0
      ignore_errors: true
