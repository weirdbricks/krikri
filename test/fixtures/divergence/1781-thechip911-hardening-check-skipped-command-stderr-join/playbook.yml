---
# thechip911.hardening's tasks/sshconfig.yml, the two tasks verbatim. Under
# --check the command task is skipped, so its registered result carries no
# `stderr`: real ansible resolves `ssh_version.stderr` to None, regex_search
# finds no match and the join filter fails the task with Python's TypeError.
- name: hardening ssh version fact
  hosts: all
  gather_facts: false
  tasks:
    - name: Get installed ssh version
      ansible.builtin.command:
        cmd: ssh -V
      changed_when: false
      failed_when: false
      register: ssh_version
      tags:
        - sshd
        - sshd_config

    - name: Set ssh version as fact
      ansible.builtin.set_fact:
        ssh_installed_version: "{{ ssh_version.stderr | regex_search('^OpenSSH_([0-9+].[0-9]+)', '\\1') | join('.') | float }}"  # noqa var-spacing
      tags:
        - sshd
        - sshd_config
