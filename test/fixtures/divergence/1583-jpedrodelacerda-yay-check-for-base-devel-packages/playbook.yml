---
# The play krikri-role-tester runs for the role; only the inventory and the
# role's become: differ. The round's testhost ran the role as root, while a
# localhost capture cannot sudo (the tasks themselves do not need root before
# the pacman probe fails), so roles/jpedrodelacerda.yay/tasks/main.yml carries
# no become: line.
- hosts: localhost
  connection: local
  gather_facts: true
  roles:
    - jpedrodelacerda.yay
