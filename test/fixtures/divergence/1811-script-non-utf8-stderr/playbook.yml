# krikri-playbook-generator playbook 000028-multi-script-happy.yml's play
# "multi-task #28.0" verbatim, except for what cannot run in the corpus: the
# loop keeps only the /opt/kpg-fixtures entry that diverges (the other seven
# are valid UTF-8 scripts whose "not found" stderr names the random
# ansible-tmp directory, which no recording can reproduce), and that entry
# points at this case's own copy of the fixture's bytes. Play #28.1 is
# dropped: the handler's failure ends the run there, so real never reaches it.
- name: 'Krikri-playbook-generator: multi-task #28.0'
  hosts: kpg_targets
  gather_facts: false
  connection: local
  vars:
    kpg_delegate: target2
    kpg_lookup_value: "{{ lookup('kpg_sideeffect') }}"
    kpg_expr_value: "{{ 'x' | kpg_multi(*['a', 'b']) }}"
  tasks:
    - name: 'Script #28.0'
      ansible.builtin.script:
        cmd: '{{ item }}'
        executable: /bin/sh
      register: kpg_task_0
      ignore_errors: true
      loop:
        - '{{ playbook_dir }}/binary-script.sh'
      notify: Kpg handler
      delegate_to: '{{ kpg_delegate }}'
    - name: Kpg notifier
      ansible.builtin.command:
        cmd: /bin/true
      changed_when: true
      ignore_errors: true
      notify: Kpg handler
    - name: Kpg flush handlers
      ansible.builtin.meta: flush_handlers
  handlers:
    - name: Kpg handler
      ansible.builtin.command:
        cmd: /bin/false
      changed_when: false
