# Same inventory shape as 1681/1687/1704/1707: the interpreter pin on
# `target` keeps ansible's interpreter-discovery exec (krikri does not model
# it) from becoming the host's first ssh usage, so both engines book the host
# at the task the case is about.
target ansible_connection=ssh ansible_host=192.0.2.1 ansible_user=root ansible_python_interpreter=/usr/bin/python3 ansible_ssh_executable=./always-fail
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3
