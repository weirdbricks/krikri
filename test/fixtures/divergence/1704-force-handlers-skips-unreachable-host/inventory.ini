# The issue's own inventory, with the `always-fail` wrapper path made
# relative to the case directory. The interpreter pin on `target` keeps
# ansible's interpreter-discovery exec (krikri does not model it) from
# becoming the host's first ssh usage - with the pin, the handler's `ping`
# dispatch is, which is the issue's scenario.
target ansible_connection=ssh ansible_host=192.0.2.1 ansible_user=root ansible_python_interpreter=/usr/bin/python3 ansible_ssh_executable=./always-fail
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3
