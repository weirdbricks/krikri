# The issue's own inventory, with the stub transport's path made relative to
# the case directory. `probe-only-ssh` answers only the platform probe and
# reports an architecture unlike the controller's; the skipped task never
# dispatches, so nothing else ever talks to `linuxhost`.
linuxhost ansible_connection=ssh ansible_host=192.0.2.1 ansible_user=root ansible_ssh_executable=./probe-only-ssh ansible_python_interpreter=/usr/bin/python3
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3
