# Two distinct inventory host aliases, both ansible_connection=local (so
# no real second machine is needed to SSH into) - lets a spec exercise
# hostvars['other_host'] cross-host lookups for real, without needing
# actual multi-node SSH infrastructure.
[hostvars_test]
h1 ansible_connection=local h1_only_var=from_h1
h2 ansible_connection=local h2_only_var=from_h2
