# Isolated inventory + group_vars/host_vars directories for the
# group_vars:/host_vars: integration spec - kept in its own subdirectory
# (rather than spec/fixtures/ directly) so its group_vars/host_vars files
# can't leak into any other fixture that happens to share a group/host
# name against the shared spec/fixtures/inventory.ini.
[web]
web1 ansible_connection=local
