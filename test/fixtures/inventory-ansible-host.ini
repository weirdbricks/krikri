# A host whose connection address differs from its inventory name, so the
# three magic variables are all distinguishable from one another:
#   inventory_hostname -> web1
#   ansible_host       -> 127.0.0.1 (must NOT be overwritten with "web1")
#   ansible_hostname   -> the gathered fact, i.e. this machine's real
#                         hostname (must NOT be overwritten with "web1")
# ansible_connection=local keeps it runnable without a second machine.
[magicvars]
web1 ansible_connection=local ansible_host=127.0.0.1
