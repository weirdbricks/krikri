# A runnable single-host inventory for integration specs that used to
# pass `-i "localhost,"` (the host_list source). That source creates an
# EXPLICIT inventory localhost - a plain ssh target in ansible-core
# (issue #677: only the IMPLICIT localhost, auto-created when no
# inventory entry exists, is local) - so a bare `-i localhost,` play now
# fails UNREACHABLE with "ssh: connect to host localhost port 22",
# exactly like real ansible. Specs that mean "run locally" point here.
localhost ansible_connection=local
