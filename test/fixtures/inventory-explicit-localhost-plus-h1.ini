# Explicit localhost PLUS an unrelated non-localhost host, for the
# implicit-vs-explicit localhost precedence spec: the play targets h1 (no
# localhost anywhere in scope for implicit-localhost purposes) while
# hostvars['localhost'] must resolve to the explicitly-declared entry with
# its own real var.
[hostvars_test]
h1 ansible_connection=local h1_only_var=from_h1
localhost ansible_connection=local my_real_var=explicit_wins
