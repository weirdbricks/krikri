- name: assert
  hosts: localhost
  gather_facts: false
  vars:
    my_param: 150
    my_list: [a, b, c]
  tasks:
    - name: a passing multi-condition assertion
      ansible.builtin.assert:
        that:
          - my_param > 0
          - my_param < 1000

    - name: a failing multi-condition assertion, default message
      ansible.builtin.assert:
        that:
          - my_param <= 100
          - my_param >= 0
      ignore_errors: true
      register: fail_result

    - name: a failing assertion with a custom fail_msg
      ansible.builtin.assert:
        that: my_param <= 100
        fail_msg: "param too big"
      ignore_errors: true
      register: custom_fail_result

    - name: a passing assertion with a custom success_msg
      ansible.builtin.assert:
        that: "1 == 1"
        success_msg: "all good"
      register: success_result

    - name: a {{ }}-wrapped dotted-access condition
      ansible.builtin.assert:
        that: "{{ my_param > 100 }}"
      register: dotted_result

    # Regression coverage for a real, previously-shipped cross-cutting
    # engine bug (fixed alongside the compat coverage below): a bare
    # when:/assert: that: condition combining a filter with a comparison
    # (or used bare) always evaluated the filter-chain text itself as an
    # undefined variable - `mylist | length > 0` always evaluated false,
    # regardless of the actual list. The same underlying bug also broke
    # {{ }}-wrapped combinations (a comparison operator was detected
    # before the `|` filter check, in the same expression), not just
    # when:'s own bare-conditional path.
    - name: a bare filter chain combined with a comparison
      ansible.builtin.assert:
        that:
          - my_list | length > 0
          - my_list | length == 3
      register: filter_bare_result

    - name: a {{ }}-wrapped filter chain combined with a comparison
      ansible.builtin.assert:
        that: "{{ my_list | length > 0 }}"
      register: filter_wrapped_result

    - name: write the stable results to a file for comparison
      ansible.builtin.copy:
        content: |
          fail_failed={{ fail_result.failed }}
          fail_msg={{ fail_result.msg }}
          custom_fail_msg={{ custom_fail_result.msg }}
          success_msg={{ success_result.msg }}
          dotted_failed={{ dotted_result.failed }}
          filter_bare_failed={{ filter_bare_result.failed }}
          filter_wrapped_failed={{ filter_wrapped_result.failed }}
        dest: /work/assert-output.txt
