# Compat coverage for postgresql_privs (shipped in 0.9.44; language/
# tablespace/type/ALL_IN_SCHEMA/fail_on_role added in 0.9.54;
# foreign_data_wrapper/foreign_server/parameter/group added in 0.9.56):
# the object types this codebase implements - table (with grant revoked,
# grant_option granted then revoked leaving the underlying privilege
# intact), schema, database, language, tablespace, type,
# foreign_data_wrapper, foreign_server, parameter, and group (role
# membership, a fundamentally different SQL construct - see
# plugins/postgresql_privs.cr) - are exercised here, plus ALL_IN_SCHEMA
# (table) and fail_on_role: false. function/procedure were added in
# 0.9.83 and are covered here too: one overload of an overloaded
# function granted while the other is left alone (the case a bare name
# could never express), a multi-argument signature written with the
# colon separator real Ansible uses, a procedure, a revoke, and
# ALL_IN_SCHEMA over routines - with the resulting pg_proc ACLs read
# back and diffed, so this proves the actual privilege state matches,
# not just the changed flags. default_privs was added in 0.9.84 and is
# covered too: a grant for future tables, an idempotent repeat, widening
# across two classes, ALL_DEFAULT, and a revoke - with pg_default_acl
# read back, plus a table created afterwards so the ACL it inherits
# proves the default privileges actually took effect rather than merely
# being recorded. objs: SCHEMAS is deliberately not covered: PostgreSQL
# rejects "IN SCHEMA ... ON SCHEMAS", and since schema: defaults to
# public that combination fails on both engines identically (verified) -
# there is nothing to compare. This playbook is deliberately scoped to prove
# the implemented surface works, not to be a full postgresql_privs
# feature matrix. session_role: isn't covered here either - verified
# manually instead against a real server (see git log, 0.9.54),
# to avoid the extra role-membership setup complexity in this already
# multi-role playbook.
#
# The playbook starts its own throwaway PostgreSQL cluster inside the
# container via the init.d script (no systemd in this image), the same
# convention 36-postgresql-db.yml already uses.

- name: postgresql_privs compat
  hosts: localhost
  gather_facts: false

  vars:
    login_host: 127.0.0.1
    login_user: postgres
    login_password: compatpass
    login_db: compatprivsdb

  tasks:
    - name: start postgresql
      ansible.builtin.shell: service postgresql start
      changed_when: false

    - name: wait for postgresql to accept connections
      ansible.builtin.wait_for:
        port: 5432
        timeout: 60

    # krikri-playbook parses become:/become_user: but plain su avoids any
    # doubt either way - same convention 36-postgresql-db.yml uses.
    - name: set a password for the postgres superuser
      ansible.builtin.shell: |
        su postgres -c "psql -c \"ALTER USER postgres PASSWORD 'compatpass';\""
      changed_when: false

    - name: create the test database
      community.postgresql.postgresql_db:
        name: "{{ login_db }}"
        state: present
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"

    - name: create a throwaway role to grant privileges to
      community.postgresql.postgresql_user:
        name: compatprivsrole
        state: present
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"

    - name: create two test tables
      ansible.builtin.shell: |
        PGPASSWORD=compatpass psql --host=127.0.0.1 --username=postgres --dbname={{ login_db }} \
          -c "CREATE TABLE t (id int); CREATE TABLE t2 (id int);"
      changed_when: false

    - name: grant SELECT+UPDATE on t to the role
      community.postgresql.postgresql_privs:
        type: table
        objs: t
        privs: SELECT,UPDATE
        roles: compatprivsrole
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: grant_first

    - name: grant SELECT+UPDATE on t again (idempotent)
      community.postgresql.postgresql_privs:
        type: table
        objs: t
        privs: SELECT,UPDATE
        roles: compatprivsrole
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: grant_idempotent

    - name: grant SELECT WITH GRANT OPTION on t2
      community.postgresql.postgresql_privs:
        type: table
        objs: t2
        privs: SELECT
        roles: compatprivsrole
        grant_option: true
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: grant_option_on

    - name: revoke just the grant option on t2 (privilege itself stays)
      community.postgresql.postgresql_privs:
        type: table
        objs: t2
        privs: SELECT
        roles: compatprivsrole
        grant_option: false
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: grant_option_off

    - name: revoke UPDATE on t
      community.postgresql.postgresql_privs:
        type: table
        objs: t
        privs: UPDATE
        roles: compatprivsrole
        state: absent
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: revoke_update

    - name: grant USAGE+CREATE on the public schema
      community.postgresql.postgresql_privs:
        type: schema
        objs: public
        privs: USAGE,CREATE
        roles: compatprivsrole
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: grant_schema

    - name: grant CONNECT on the database itself
      community.postgresql.postgresql_privs:
        type: database
        objs: "{{ login_db }}"
        privs: CONNECT
        roles: compatprivsrole
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: grant_database

    - name: grant USAGE on the plpgsql language
      community.postgresql.postgresql_privs:
        type: language
        objs: plpgsql
        privs: USAGE
        roles: compatprivsrole
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: grant_language

    - name: grant CREATE on the pg_default tablespace
      community.postgresql.postgresql_privs:
        type: tablespace
        objs: pg_default
        privs: CREATE
        roles: compatprivsrole
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: grant_tablespace

    - name: create a throwaway enum type
      ansible.builtin.shell: |
        PGPASSWORD=compatpass psql --host=127.0.0.1 --username=postgres --dbname={{ login_db }} \
          -c "CREATE TYPE mood AS ENUM ('sad','ok','happy');"
      changed_when: false

    - name: grant USAGE on the mood type
      community.postgresql.postgresql_privs:
        type: type
        objs: mood
        privs: USAGE
        roles: compatprivsrole
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: grant_type

    - name: create a third table for ALL_IN_SCHEMA coverage
      ansible.builtin.shell: |
        PGPASSWORD=compatpass psql --host=127.0.0.1 --username=postgres --dbname={{ login_db }} \
          -c "CREATE TABLE t3 (id int);"
      changed_when: false

    - name: grant SELECT on every table in the public schema
      community.postgresql.postgresql_privs:
        type: table
        objs: ALL_IN_SCHEMA
        schema: public
        privs: SELECT
        roles: compatprivsrole
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: grant_all_in_schema

    - name: create overloaded functions and a procedure
      ansible.builtin.shell: |
        PGPASSWORD=compatpass psql --host=127.0.0.1 --username=postgres --dbname={{ login_db }} \
          -c "CREATE FUNCTION fn1(a int) RETURNS int AS \$\$ SELECT a \$\$ LANGUAGE sql;
              CREATE FUNCTION fn1(a text) RETURNS text AS \$\$ SELECT a \$\$ LANGUAGE sql;
              CREATE FUNCTION fn2(a int, b text) RETURNS int AS \$\$ SELECT a \$\$ LANGUAGE sql;
              CREATE PROCEDURE pr1(a int) LANGUAGE sql AS \$\$ SELECT 1 \$\$;"
      changed_when: false

    - name: grant EXECUTE on one overload only
      community.postgresql.postgresql_privs:
        type: function
        objs: "fn1(int)"
        schema: public
        privs: EXECUTE
        roles: compatprivsrole
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: grant_function

    - name: grant EXECUTE on that overload again (idempotent)
      community.postgresql.postgresql_privs:
        type: function
        objs: "fn1(int)"
        schema: public
        privs: EXECUTE
        roles: compatprivsrole
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: grant_function_idempotent

    - name: grant EXECUTE on a multi-argument signature (colon-separated)
      community.postgresql.postgresql_privs:
        type: function
        objs: "fn2(int:text)"
        schema: public
        privs: EXECUTE
        roles: compatprivsrole
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: grant_function_multiarg

    - name: grant EXECUTE on a procedure
      community.postgresql.postgresql_privs:
        type: procedure
        objs: "pr1(int)"
        schema: public
        privs: EXECUTE
        roles: compatprivsrole
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: grant_procedure

    - name: revoke EXECUTE from the one overload again
      community.postgresql.postgresql_privs:
        type: function
        objs: "fn1(int)"
        schema: public
        privs: EXECUTE
        roles: compatprivsrole
        state: absent
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: revoke_function

    - name: grant EXECUTE on every function in the schema
      community.postgresql.postgresql_privs:
        type: function
        objs: ALL_IN_SCHEMA
        schema: public
        privs: EXECUTE
        roles: compatprivsrole
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: grant_functions_all_in_schema

    - name: read back the routine ACLs
      ansible.builtin.shell: |
        PGPASSWORD=compatpass psql --host=127.0.0.1 --username=postgres --dbname={{ login_db }} -At \
          -c "SELECT p.proname || '(' || coalesce((SELECT string_agg(format_type(t, NULL), ',' ORDER BY o)
                       FROM unnest(p.proargtypes) WITH ORDINALITY a(t, o)), '') || ')=' ||
                     (coalesce(p.proacl::text, '') LIKE '%compatprivsrole=X%')::text
              FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public' ORDER BY 1"
      register: routine_acls
      changed_when: false

    - name: default privileges for future tables
      community.postgresql.postgresql_privs:
        type: default_privs
        schema: public
        objs: TABLES
        privs: SELECT
        roles: compatprivsrole
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: default_privs_tables

    - name: default privileges for future tables again (idempotent)
      community.postgresql.postgresql_privs:
        type: default_privs
        schema: public
        objs: TABLES
        privs: SELECT
        roles: compatprivsrole
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: default_privs_idempotent

    - name: widen default privileges across two classes
      community.postgresql.postgresql_privs:
        type: default_privs
        schema: public
        objs: "TABLES,SEQUENCES"
        privs: "SELECT,UPDATE"
        roles: compatprivsrole
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: default_privs_widen

    - name: default privileges via ALL_DEFAULT
      community.postgresql.postgresql_privs:
        type: default_privs
        schema: public
        objs: ALL_DEFAULT
        privs: ALL
        roles: compatprivsrole
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: default_privs_all

    - name: create a table so the default privileges actually apply to something
      ansible.builtin.shell: |
        PGPASSWORD=compatpass psql --host=127.0.0.1 --username=postgres --dbname={{ login_db }} \
          -c "CREATE TABLE future_tab (id int);"
      changed_when: false

    - name: read back the new table's ACL (proves default privs took effect)
      ansible.builtin.shell: |
        PGPASSWORD=compatpass psql --host=127.0.0.1 --username=postgres --dbname={{ login_db }} -At \
          -c "SELECT (coalesce(relacl::text, '') LIKE '%compatprivsrole=%')::text
              FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND relname = 'future_tab'"
      register: future_tab_acl
      changed_when: false

    - name: revoke the default privileges again
      community.postgresql.postgresql_privs:
        type: default_privs
        schema: public
        objs: TABLES
        privs: SELECT
        roles: compatprivsrole
        state: absent
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: default_privs_revoked

    - name: read back pg_default_acl
      ansible.builtin.shell: |
        PGPASSWORD=compatpass psql --host=127.0.0.1 --username=postgres --dbname={{ login_db }} -At \
          -c "SELECT r.rolname || '/' || n.nspname || '/' || a.defaclobjtype::text || '=' || a.defaclacl::text
              FROM pg_default_acl a
              JOIN pg_roles r ON r.oid = a.defaclrole
              JOIN pg_namespace n ON n.oid = a.defaclnamespace
              ORDER BY 1"
      register: default_acls
      changed_when: false

    - name: attempt a grant for a nonexistent role with fail_on_role false
      community.postgresql.postgresql_privs:
        type: table
        objs: t3
        privs: SELECT
        roles: does_not_exist_role
        fail_on_role: false
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: grant_missing_role_soft

    - name: create a throwaway foreign data wrapper and server
      ansible.builtin.shell: |
        PGPASSWORD=compatpass psql --host=127.0.0.1 --username=postgres --dbname={{ login_db }} \
          -c "CREATE FOREIGN DATA WRAPPER compatfdw; CREATE SERVER compatsrv FOREIGN DATA WRAPPER compatfdw;"
      changed_when: false

    - name: grant USAGE on the foreign data wrapper
      community.postgresql.postgresql_privs:
        type: foreign_data_wrapper
        objs: compatfdw
        privs: USAGE
        roles: compatprivsrole
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: grant_fdw

    - name: grant USAGE on the foreign server
      community.postgresql.postgresql_privs:
        type: foreign_server
        objs: compatsrv
        privs: USAGE
        roles: compatprivsrole
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: grant_srv

    - name: grant SET and ALTER_SYSTEM on the work_mem parameter
      community.postgresql.postgresql_privs:
        type: parameter
        objs: work_mem
        privs: SET,ALTER_SYSTEM
        roles: compatprivsrole
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: grant_param

    - name: revoke just ALTER_SYSTEM on work_mem (SET stays granted)
      community.postgresql.postgresql_privs:
        type: parameter
        objs: work_mem
        privs: ALTER_SYSTEM
        roles: compatprivsrole
        state: absent
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: revoke_param

    - name: create a throwaway group role
      ansible.builtin.shell: |
        PGPASSWORD=compatpass psql --host=127.0.0.1 --username=postgres --dbname={{ login_db }} \
          -c "CREATE ROLE compatprivsgroup;"
      changed_when: false

    - name: grant group membership (compatprivsgroup -> compatprivsrole)
      community.postgresql.postgresql_privs:
        type: group
        objs: compatprivsgroup
        roles: compatprivsrole
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: grant_group

    - name: idempotent rerun of group membership
      community.postgresql.postgresql_privs:
        type: group
        objs: compatprivsgroup
        roles: compatprivsrole
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: grant_group_idempotent

    - name: grant group membership WITH ADMIN OPTION
      community.postgresql.postgresql_privs:
        type: group
        objs: compatprivsgroup
        roles: compatprivsrole
        grant_option: true
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: grant_group_admin

    - name: revoke group membership
      community.postgresql.postgresql_privs:
        type: group
        objs: compatprivsgroup
        roles: compatprivsrole
        state: absent
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
        login_db: "{{ login_db }}"
      register: revoke_group

    - name: read back the new types' ACLs
      ansible.builtin.shell: >-
        PGPASSWORD=compatpass psql --host=127.0.0.1 --username=postgres --dbname={{ login_db }}
        -tAc "SELECT fdwacl::text FROM pg_foreign_data_wrapper WHERE fdwname='compatfdw'; SELECT srvacl::text FROM pg_foreign_server WHERE srvname='compatsrv'; SELECT paracl::text FROM pg_parameter_acl WHERE parname='work_mem'; SELECT count(*) FROM pg_auth_members am JOIN pg_roles g ON g.oid=am.roleid JOIN pg_roles m ON m.oid=am.member WHERE g.rolname='compatprivsgroup' AND m.rolname='compatprivsrole';"
      register: new_types_acls
      changed_when: false

    - name: read back the mood type's ACL
      ansible.builtin.shell: >-
        PGPASSWORD=compatpass psql --host=127.0.0.1 --username=postgres --dbname={{ login_db }}
        -tAc "SELECT typacl::text FROM pg_type WHERE typname = 'mood'"
      register: mood_acl
      changed_when: false

    - name: read back t3's ACL (proves ALL_IN_SCHEMA covered it too)
      ansible.builtin.shell: >-
        PGPASSWORD=compatpass psql --host=127.0.0.1 --username=postgres --dbname={{ login_db }}
        -tAc "SELECT relacl::text FROM pg_class WHERE relname = 't3'"
      register: t3_acl
      changed_when: false

    - name: read back the final table ACLs
      ansible.builtin.shell: >-
        PGPASSWORD=compatpass psql --host=127.0.0.1 --username=postgres --dbname={{ login_db }}
        -t -c "SELECT relacl::text FROM pg_class WHERE relname IN ('t','t2') ORDER BY relname" | tr -d ' ' | tr '\n' ';'
      register: final_table_acls
      changed_when: false

    - name: record results
      ansible.builtin.copy:
        content: |
          grant_first={{ grant_first.changed }}
          grant_idempotent={{ grant_idempotent.changed }}
          grant_option_on={{ grant_option_on.changed }}
          grant_option_off={{ grant_option_off.changed }}
          revoke_update={{ revoke_update.changed }}
          grant_schema={{ grant_schema.changed }}
          grant_database={{ grant_database.changed }}
          grant_language={{ grant_language.changed }}
          grant_tablespace={{ grant_tablespace.changed }}
          grant_type={{ grant_type.changed }}
          grant_all_in_schema={{ grant_all_in_schema.changed }}
          grant_missing_role_soft={{ grant_missing_role_soft.changed }}
          grant_fdw={{ grant_fdw.changed }}
          grant_srv={{ grant_srv.changed }}
          grant_param={{ grant_param.changed }}
          revoke_param={{ revoke_param.changed }}
          grant_group={{ grant_group.changed }}
          grant_group_idempotent={{ grant_group_idempotent.changed }}
          grant_group_admin={{ grant_group_admin.changed }}
          revoke_group={{ revoke_group.changed }}
          new_types_acls={{ new_types_acls.stdout }}
          mood_acl={{ mood_acl.stdout }}
          t3_acl={{ t3_acl.stdout }}
          final_table_acls={{ final_table_acls.stdout }}
          grant_function={{ grant_function.changed }}
          grant_function_idempotent={{ grant_function_idempotent.changed }}
          grant_function_multiarg={{ grant_function_multiarg.changed }}
          grant_procedure={{ grant_procedure.changed }}
          revoke_function={{ revoke_function.changed }}
          grant_functions_all_in_schema={{ grant_functions_all_in_schema.changed }}
          routine_acls={{ routine_acls.stdout }}
          default_privs_tables={{ default_privs_tables.changed }}
          default_privs_idempotent={{ default_privs_idempotent.changed }}
          default_privs_widen={{ default_privs_widen.changed }}
          default_privs_all={{ default_privs_all.changed }}
          future_tab_acl={{ future_tab_acl.stdout }}
          default_privs_revoked={{ default_privs_revoked.changed }}
          default_acls={{ default_acls.stdout }}
        dest: /work/results.txt

    - name: clean up
      community.postgresql.postgresql_db:
        name: "{{ login_db }}"
        state: absent
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"

    - name: remove the throwaway role
      community.postgresql.postgresql_user:
        name: compatprivsrole
        state: absent
        login_host: "{{ login_host }}"
        login_user: "{{ login_user }}"
        login_password: "{{ login_password }}"
